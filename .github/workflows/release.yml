name: Synapse Offer Consistency Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply offer consistency hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          from stat import S_IFLNK
          from urllib.parse import urlsplit, unquote
          import json, re

          root=Path('.')
          payload=Path('payload.zip')
          if not payload.is_file(): raise SystemExit('payload.zip missing')

          allowed=['urunler.html','urunler/revenueos.html']
          baseline={
            'urunler.html':'ae01447f624038e69e9339a64405d8f13ef67b42da6b9aef6cbed55fb8d5f7c9',
            'urunler/revenueos.html':'f5bad9dc5d09de7557226cb90dccd78429e2d6bd52e5842e44f623ea91a844eb',
          }
          expected={
            'urunler.html':'f25bb8871093933f8e78bf9673cab635c8888809724ca83b0e2f30cb28aad965',
            'urunler/revenueos.html':'b13f7a613d6e93143dc8b8c4db42e1bfebb5c0be213abc0b7ded663ffbf5dc2e',
          }
          protect={
            'index.html':'5bde8f79923db2c6296f9ce5ac5406c847d3976aff98d634cbec9a032aac502c',
            '404.html':'d5455f47106a462b776a8deda69d5d80483653e90c3ddcbe05ddab9a4509aca9',
            'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html':'039c6077bcc265277ecc1e4fa7fd3aaa5a771645ce404814ad4b84df422e6398',
            'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html':'a1196c85019ed381d79d59c0544e25e00b0aa7679c252b268a6b582a051d83c0',
            'sektorler/e-ticaret.html':'243c3c4e4e8baeb6999a2aac479b18f43289f95856659a6b0f34c90b2679225f',
            'assets/js/synapse-measurement-v1.js':'a5d40b8e98db20c58950f1ea5be5600bb62c3ca4eb31213a86c23fde472000fd',
            'rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html':'10c3f0deaf0a791fb4420c41e31032117329aae7a7437c96cdc4644d96c65df1',
            'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf':'ab8efa086762a6ede708f74ce04aa74f6d4e6f5bcd15dfb1123d9da30808dcc6',
          }

          for f,h in baseline.items():
              p=root/f
              if not p.is_file(): raise SystemExit('Baseline file missing: '+f)
              got=sha256(p.read_bytes()).hexdigest()
              if got!=h: raise SystemExit('Baseline mismatch for '+f+'; stop and refresh live repo')
          for f,h in protect.items():
              p=root/f
              if not p.is_file() or sha256(p.read_bytes()).hexdigest()!=h:
                  raise SystemExit('Previously closed asset changed unexpectedly: '+f)

          with ZipFile(payload) as z:
              names=z.namelist()
              if sorted(names)!=sorted(allowed): raise SystemExit('Payload path set mismatch: '+repr(names))
              for info in z.infolist():
                  pp=Path(info.filename)
                  if pp.is_absolute() or '..' in pp.parts: raise SystemExit('Unsafe payload path: '+info.filename)
                  if ((info.external_attr>>16)&0o170000)==S_IFLNK: raise SystemExit('Symlink not allowed: '+info.filename)
              z.extractall('.')

          for f,h in expected.items():
              if sha256((root/f).read_bytes()).hexdigest()!=h:
                  raise SystemExit('Applied hash mismatch: '+f)

          for f in allowed:
              p=root/f; s=p.read_text(encoding='utf-8')
              for bad in ('9.900 TL','RevenueOS','AgentReady','MagnetFlow','Vela','72 Saatlik','Founder Pilot','Day 22','Gün 22','QA PASS','Run Workflow','release.yml','payload.zip','SATIN ALMA PAKETİ'):
                  if bad.lower() in s.lower(): raise SystemExit('Legacy/internal public phrase remains: '+bad+' in '+f)
              if re.search(r'\$\s?\d',s): raise SystemExit('Ambiguous USD equivalent remains in '+f)
              for value in re.findall(r'\b(?:href|src)=["\']([^"\']+)',s,re.I):
                  if not value or value.startswith(('#','https:','http:','mailto:','tel:','data:')): continue
                  path=unquote(urlsplit(value).path)
                  dest=root/path.lstrip('/') if path.startswith('/') else p.parent/path
                  if not dest.resolve().is_file(): raise SystemExit('Broken local resource '+value+' in '+f)
              for block in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',s,re.S|re.I): json.loads(block)

          u=(root/'urunler.html').read_text(encoding='utf-8')
          r=(root/'urunler/revenueos.html').read_text(encoding='utf-8')
          for price in ('4.900 TL','24.900 TL','14.900 TL'):
              if price not in u or price not in r: raise SystemExit('Canonical commercial price missing: '+price)
          for phrase in ('Süreç Analizi','Kontrollü Pilot','Aylık Yönetim'):
              if phrase not in u or phrase not in r: raise SystemExit('Canonical funnel stage missing: '+phrase)
          if 'Ücretsiz özel geliştirme yapılmaz.' not in r: raise SystemExit('No-free-custom-development boundary missing')
          if 'G-HQSRRJ5HMZ' not in (root/'assets/js/synapse-measurement-v1.js').read_text(encoding='utf-8'):
              raise SystemExit('GA4 identity missing')
          print('OFFER CONSISTENCY HOTFIX: PASS')
          PYQA
          git diff --check

      - name: Commit hotfix and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          python3 - <<'PYQA'
          import subprocess
          allowed={'urunler.html','urunler/revenueos.html','payload.zip','.github/workflows/release.yml'}
          out=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)
          seen=set()
          for line in out.splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              seen.add(path)
          unexpected=seen-allowed
          if unexpected: raise SystemExit('Unexpected working-tree changes: '+', '.join(sorted(unexpected)))
          print('WORKTREE SCOPE: PASS')
          PYQA
          git config user.name "synapse-offer-consistency-hotfix"
          git config user.email "synapse-offer-consistency-hotfix@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: align legacy solution pages with canonical offer"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' \
            --exclude 'D01/' --exclude 'D02/' --exclude 'D03/' \
            --exclude '__pycache__/' --exclude '*.zip' --exclude '*.sha256' --exclude '*.py' \
            --exclude 'README*.md' --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/urunler.html
          test -f _site/urunler/revenueos.html
          test -f _site/kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
