name: Synapse Self-Contained 404 Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          test -f payload.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          expected_zip='f263a7027e7db5188332761bb2ab0aeb935f545bedf210d7a634fdec106a3203'
          expected={
            '404.html':'d5455f47106a462b776a8deda69d5d80483653e90c3ddcbe05ddab9a4509aca9',
            'rehberler/kurumsal-ai-satin-alma-kontrol-listesi.html':'674f097e8d9e3f91bea9a8144728ec1ee3c0a5d3cb457a51fb7a85517306282a'
          }
          data=Path('payload.zip').read_bytes()
          if sha256(data).hexdigest()!=expected_zip:
              raise SystemExit('payload.zip hash mismatch')
          with ZipFile('payload.zip') as z:
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              if names!=sorted(expected):
                  raise SystemExit('Unexpected payload contents: '+repr(names))
              for name,want in expected.items():
                  b=z.read(name)
                  if sha256(b).hexdigest()!=want:
                      raise SystemExit(name+' hash mismatch')
                  p=Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(b)

          s=Path('404.html').read_text(encoding='utf-8')
          required=['<style>','Aradığınız sayfa burada değil.','https://synapseautomate.github.io/','noindex,follow']
          for item in required:
              if item not in s: raise SystemExit('Missing 404 requirement: '+item)
          forbidden=['styles-v33.css','synapse-logo.png','app-v33.js','src="/assets/','href="/assets/','Day 21','QA PASS','payload.zip','release.yml']
          for item in forbidden:
              if item.lower() in s.lower(): raise SystemExit('Forbidden 404 dependency/content: '+item)

          r=Path('rehberler/kurumsal-ai-satin-alma-kontrol-listesi.html').read_text(encoding='utf-8')
          target='https://synapseautomate.github.io/rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html'
          if r.count(target) < 3: raise SystemExit('Redirect target missing/incomplete')
          if 'location.replace' not in r or 'http-equiv="refresh"' not in r: raise SystemExit('Redirect mechanisms missing')
          if not Path('rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html').exists():
              raise SystemExit('Canonical Day 21 page missing from repository')
          print('SELF-CONTAINED 404 + TYPO REDIRECT QA: PASS')
          PY
          git diff --check

      - name: Commit hotfix and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          git config user.name "synapse-release"
          git config user.email "synapse-release@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: self-contained 404 and typo redirect"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '*.zip' \
            --exclude '*.sha256' \
            --exclude '*.py' \
            --exclude 'README*.md' \
            --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/rehberler/kurumsal-ai-satin-alma-kontrol-listesi.html
          test -f _site/rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html
          grep -q '<style>' _site/404.html
          ! grep -q 'styles-v33.css' _site/404.html
          grep -q 'location.replace' _site/rehberler/kurumsal-ai-satin-alma-kontrol-listesi.html
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
