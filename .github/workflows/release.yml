name: Synapse Monitoring PDF Price Clarity Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply one-file PDF correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          from stat import S_IFMT, S_IFLNK
          target=Path('assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf')
          old_sha='2091cb820162628ccbe9bc3f52568eaf150f461173e2270a4ca12321adb21d20'
          new_sha='ab8efa086762a6ede708f74ce04aa74f6d4e6f5bcd15dfb1123d9da30808dcc6'
          zip_sha='01b04156aa3b34a8520ab4cd5bf44446ad8071e4f87b97fd523d6fb22c803ada'
          package=Path('payload.zip')
          def digest(data): return sha256(data).hexdigest()
          if not package.is_file() or digest(package.read_bytes()) != zip_sha:
              raise SystemExit('Incorrect PDF correction payload')
          if not target.is_file() or digest(target.read_bytes()) not in (old_sha,new_sha):
              raise SystemExit('The live PDF no longer matches the verified Day 20 baseline: STOP')
          with ZipFile(package) as z:
              entries=[i for i in z.infolist() if not i.is_dir()]
              if len(entries)!=1 or entries[0].filename!=str(target):
                  raise SystemExit('Payload must contain ONLY the existing report PDF')
              member=entries[0]
              if member.filename.startswith('/') or '..' in Path(member.filename).parts or S_IFMT(member.external_attr>>16)==S_IFLNK:
                  raise SystemExit('Unsafe payload entry')
              value=z.read(member)
              if digest(value)!=new_sha or not value.startswith(b'%PDF-') or b'/Count 7' not in value:
                  raise SystemExit('Corrected seven-page report failed content integrity')
              target.write_bytes(value)
          print('One-file PDF integrity and baseline guard: PASS')
          PYQA
          # PDFs are binary. Prevent Git whitespace checks from scanning compressed data.
          if ! grep -qxF '*.pdf -text -diff' .gitattributes 2>/dev/null; then
            printf '\n*.pdf -text -diff\n' >> .gitattributes
          fi
          pdf_path=assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf
          test "$(git check-attr text -- "$pdf_path")" = "$pdf_path: text: unset"
          test "$(git check-attr diff -- "$pdf_path")" = "$pdf_path: diff: unset"
          git diff --check

      - name: Commit corrected PDF and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          git config user.name "synapse-proof-release"
          git config user.email "synapse-proof-release@users.noreply.github.com"
          git add -A -- .gitattributes assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf payload.zip .github/workflows/release.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs: clarify TRY pricing in public monitoring report"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' \
            --exclude 'D01/' --exclude 'D02/' --exclude 'D03/' \
            --exclude '__pycache__/' --exclude '*.zip' \
            --exclude '*.sha256' --exclude '*.py' \
            --exclude 'README*.md' --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/rehberler/otomasyon-izleme-ve-olay-yonetimi.html
          test -f _site/surec-analizi.html
          test -f _site/rehberler/ai-otomasyon-fiyatlari.html
          test -f _site/kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html
          sha256sum _site/assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf | grep -q '^ab8efa086762a6ede708f74ce04aa74f6d4e6f5bcd15dfb1123d9da30808dcc6 '
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo 'Clean Pages artifact including corrected PDF: PASS'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
