      - name: Buyer pack, pricing and discovery QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          from hashlib import sha256
          from xml.etree import ElementTree as ET
          import json,re
          root=Path('.').resolve()
          rel='rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html'
          page=Path(rel)
          s=page.read_text(encoding='utf-8')
          if not re.search(r'<html[^>]+lang=["\']tr["\']',s,re.I): raise SystemExit('Buyer page language invalid')
          for mark in ('Veri akışı','Roller & yetki','Gizlilik','Olay yönetimi','Destek','4.900 TL','24.900 TL','14.900 TL','müşteri sonucu','surecini-20-dakikada-haritala.html'):
              if mark not in s: raise SystemExit('Missing buyer-pack commitment: '+mark)
          for forbidden in ('Day 21','Gün 21','QA PASS','Run Workflow','release.yml','payload.zip','Nike','Red Bull'):
              if forbidden.lower() in s.lower(): raise SystemExit('Internal/unwanted public phrase: '+forbidden)
          if re.search(r'\$\s?\d',s): raise SystemExit('USD equivalent remains on Turkish buyer page')
          blocks=re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          objs=[json.loads(b) for b in blocks]
          types=[]; faq=None
          for o in objs:
              xs=o.get('@graph',[]) if isinstance(o,dict) and '@graph' in o else ([o] if isinstance(o,dict) else o)
              for x in xs:
                  if isinstance(x,dict):
                      types.append(x.get('@type'))
                      if x.get('@type')=='FAQPage': faq=x
          if 'Article' not in types or 'FAQPage' not in types: raise SystemExit('Article/FAQ schema missing')
          visible=len(re.findall(r'<summary\b',s,re.I))
          if not faq or visible!=5 or len(faq.get('mainEntity',[]))!=5: raise SystemExit('FAQ visible/schema mismatch')
          for q in faq['mainEntity']:
              if q['name'] not in s or q['acceptedAnswer']['text'] not in s: raise SystemExit('FAQ content mismatch')
          # No numeric USD equivalents anywhere on Turkish HTML after the Day 20 trust correction.
          bad=[]
          for f in Path('.').rglob('*.html'):
              txt=f.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'\$\s?\d',txt): bad.append(str(f))
          if bad: raise SystemExit('Ambiguous USD equivalents remain: '+', '.join(bad[:10]))
          # Canonical commercial prices remain intact.
          offer=Path('surec-analizi.html').read_text(encoding='utf-8')
          for price in ('4.900 TL','24.900 TL','14.900 TL'):
              if price not in offer: raise SystemExit('Canonical price missing: '+price)
          if re.search(r'\$\s?\d',offer): raise SystemExit('USD equivalent remains on Turkish offer page')
          # Discovery/indexability.
          url='https://synapseautomate.github.io/'+rel
          sm=Path('sitemap.xml').read_text(encoding='utf-8'); ET.fromstring(sm)
          if sm.count('<loc>'+url+'</loc>')!=1: raise SystemExit('Sitemap canonical not unique')
          ll=Path('llms.txt').read_text(encoding='utf-8')
          if ll.count(url)!=1 or ll.endswith('\n\n') or not ll.endswith('\n'): raise SystemExit('llms discovery/EOF invalid')
          cm=json.loads(Path('content-manifest.json').read_text(encoding='utf-8'))
          if 'kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html' not in json.dumps(cm,ensure_ascii=False): raise SystemExit('Content manifest missing buyer pack')
          # Public buyer docs v1.
          for f in ('docs/README.md','docs/enterprise-buyer-pack-v1.md','docs/data-flow-and-roles-v1.md','docs/incident-and-support-v1.md','docs/model-and-fallback-policy-v1.md','docs/CHANGELOG.md'):
              if not Path(f).is_file(): raise SystemExit('Missing buyer doc: '+f)
          # Critical previously closed work must remain intact.
          keep={
            'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf':'ab8efa086762a6ede708f74ce04aa74f6d4e6f5bcd15dfb1123d9da30808dcc6',
            'kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html':'1af2163729cbc82d355727c67b74caa7d3a51246a2d6dd112246a7a28f3c90c7',
            'assets/js/synapse-measurement-v1.js':'a5d40b8e98db20c58950f1ea5be5600bb62c3ca4eb31213a86c23fde472000fd'
          }
          for f,h in keep.items():
              if not Path(f).is_file() or sha256(Path(f).read_bytes()).hexdigest()!=h: raise SystemExit('Closed asset changed unexpectedly: '+f)
          if 'G-HQSRRJ5HMZ' not in Path('assets/js/synapse-measurement-v1.js').read_text(encoding='utf-8'): raise SystemExit('GA4 identity missing')
          # Cover and local resources.
          cover=Path('assets/day21/kurumsal-ai-satin-alma-kontrol-listesi-cover.png')
          if not cover.is_file() or cover.stat().st_size<10000: raise SystemExit('Buyer cover missing')
          if 'assets/day21/kurumsal-ai-satin-alma-kontrol-listesi-cover.png' not in s: raise SystemExit('Buyer cover metadata missing')
          for value in re.findall(r'\b(?:href|src)=["\']([^"\']+)',s,re.I):
              if not value or value.startswith(('#','https:','http:','mailto:','tel:','data:')): continue
              path=unquote(urlsplit(value).path)
              dest=root/path.lstrip('/') if path.startswith('/') else (root/page.parent/path)
              if not dest.resolve().is_file(): raise SystemExit('Broken buyer-page resource: '+value)
          robots=Path('robots.txt').read_text(encoding='utf-8')
          if 'Disallow: /rehberler/' in robots or 'Disallow: /docs/' in robots: raise SystemExit('Buyer content blocked by robots')
          print('BUYER PACK + PRICING + DISCOVERY + GA4: PASS')
          PYQA
          # Preserve binary treatment for public PDFs. Day 20 already added this on live;
          # append only if an older checkout does not contain it.
          if ! grep -qxF '*.pdf -text -diff' .gitattributes; then
            printf '\n*.pdf -text -diff\n' >> .gitattributes
          fi
          git diff --check

      - name: Commit release and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          python3 - <<'PYQA'
          import subprocess
          allowed=set(['README.md', 'araclar/egitim-ai-surec-kontrol-listesi.html', 'araclar/hukuk-uyum-ai-surec-kontrol-listesi.html', 'araclar/otomasyon-hata-maliyeti-hesaplayici.html', 'araclar/site-ai-uyumluluk-taramasi.html', 'araclar/surecini-20-dakikada-haritala.html', 'araclar/uretim-lojistik-ai-surec-kontrol-listesi.html', 'assets/day21/kurumsal-ai-satin-alma-kontrol-listesi-cover.png', 'content-manifest.json', 'cozumler/ai-otomasyon-ajansi-istanbul.html', 'cozumler/e-ticaret-operasyon-otomasyonu.html', 'cozumler/emlak-musteri-talep-takip-otomasyonu.html', 'cozumler/klinik-randevu-talep-takip-otomasyonu.html', 'cozumler/roofing-ev-hizmetleri.html', 'cozumler/rpa-danismanlik.html', 'cozumler/sigorta-acentesi-yenileme-takip-otomasyonu.html', 'cozumler/whatsapp-musteri-takip-otomasyonu.html', 'docs/CHANGELOG.md', 'docs/README.md', 'docs/data-flow-and-roles-v1.md', 'docs/enterprise-buyer-pack-v1.md', 'docs/incident-and-support-v1.md', 'docs/model-and-fallback-policy-v1.md', 'guven-merkezi.html', 'index.html', 'kanit/site-katalog-ai-hazirlik-metodolojisi.html', 'kanit/site-katalog-ai-hazirlik-ornek-rapor.html', 'karsilastirma-testi.html', 'kaynaklar.html', 'llms.txt', 'pilot/kontrollu-ai-is-akisi-pilotu.html', 'rehberler/ai-otomasyon-fiyatlari.html', 'rehberler/ai-otomasyon-guvenilirlik-testi.html', 'rehberler/ai-otomasyon-is-akisi-karar-tablosu.html', 'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html', 'rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html', 'rehberler/otomasyon-izleme-ve-olay-yonetimi.html', 'sektorler/e-ticaret.html', 'sektorler/gayrimenkul-yonetimi.html', 'sektorler/hukuk.html', 'sektorler/uretim-lojistik.html', 'sitemap.xml', 'surec-analizi.html', 'teklif/e-ticaret-surec-analizi.html', 'urunler.html', 'urunler/agentready.html', 'urunler/creative.html', 'urunler/magnetflow.html', 'urunler/revenueos.html', 'urunler/vela.html']+['.gitattributes','payload.zip','.github/workflows/release.yml'])
          out=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)
          seen=set()
          for line in out.splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              seen.add(path)
          unexpected=seen-allowed
          if unexpected: raise SystemExit('Unexpected working-tree changes: '+', '.join(sorted(unexpected)))
          print('WORKTREE SCOPE: PASS')
          PYQA
          git config user.name "synapse-enterprise-readiness-release"
          git config user.email "synapse-enterprise-readiness-release@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: publish enterprise buyer readiness pack v1"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/             --exclude '.git/'             --exclude '.github/'             --exclude '_site/'             --exclude 'D01/' --exclude 'D02/' --exclude 'D03/'             --exclude '__pycache__/' --exclude '*.zip'             --exclude '*.sha256' --exclude '*.py'             --exclude 'README*.md' --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html
          test -f _site/assets/day21/kurumsal-ai-satin-alma-kontrol-listesi-cover.png
          test -f _site/araclar/surecini-20-dakikada-haritala.html
          test -f _site/surec-analizi.html
          test -f _site/rehberler/otomasyon-izleme-ve-olay-yonetimi.html
          test -f _site/assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf
          test -f _site/kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
