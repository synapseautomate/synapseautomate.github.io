name: Synapse E-Commerce Proof Density Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply e-commerce proof payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          from stat import S_IFLNK
          import json, re
          from urllib.parse import urlsplit, unquote
          from xml.etree import ElementTree as ET

          root=Path('.')
          payload=Path('payload.zip')
          if not payload.is_file(): raise SystemExit('payload.zip missing')
          allowed=['assets/ecommerce/pilot-config-isolation-spec-cases.json', 'content-manifest.json', 'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html', 'llms.txt', 'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html', 'sektorler/e-ticaret.html', 'sitemap.xml']
          expected={'assets/ecommerce/pilot-config-isolation-spec-cases.json': 'e012b8762452f46c3ca7e5cc4caf5536891a5745ad48a2b8354296c5a29d7a82', 'content-manifest.json': 'cb97e486b8a48b42c257750039ce730a89ef65d27ee5a03c9fbbf3548acb963c', 'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html': '039c6077bcc265277ecc1e4fa7fd3aaa5a771645ce404814ad4b84df422e6398', 'llms.txt': 'e14987fd25bfe642cac7cfbc536c4a1b35d194f1448cd2515f4a594309a69af8', 'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html': 'a1196c85019ed381d79d59c0544e25e00b0aa7679c252b268a6b582a051d83c0', 'sektorler/e-ticaret.html': '243c3c4e4e8baeb6999a2aac479b18f43289f95856659a6b0f34c90b2679225f', 'sitemap.xml': 'dceec4763590857565be95e0257fc76b87bcd497a82a16c59d72ffd3e1a78c9b'}
          baseline={'assets/ecommerce/pilot-config-isolation-spec-cases.json': None, 'content-manifest.json': '0ca4589a018072c2d2220ff01c5fb79f5ff733e973ea6801ca981140b53c8dae', 'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html': None, 'llms.txt': '80c3aa9a4c0b1116606706dfd7d5fdb41c78125ff13b0d85b7060e8dddf4fad1', 'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html': 'c126ce24e9481dd226c76b29cdcf344f36df265ef1a1d4fb02feed497f7e7bdf', 'sektorler/e-ticaret.html': 'de30f160095b349548e90e8101a1eb10cccb96a066fb3042dc0cf0f2301e6112', 'sitemap.xml': '30679a7b0ff4784656385659d31dba469b4a63c91ae825ef8490f4410127a3af'}
          protect={'404.html': 'd5455f47106a462b776a8deda69d5d80483653e90c3ddcbe05ddab9a4509aca9', 'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf': 'ab8efa086762a6ede708f74ce04aa74f6d4e6f5bcd15dfb1123d9da30808dcc6', 'kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html': '1af2163729cbc82d355727c67b74caa7d3a51246a2d6dd112246a7a28f3c90c7', 'assets/js/synapse-measurement-v1.js': 'a5d40b8e98db20c58950f1ea5be5600bb62c3ca4eb31213a86c23fde472000fd', 'rehberler/kurumsal-ai-otomasyonu-satin-alma-kontrol-listesi.html': '10c3f0deaf0a791fb4420c41e31032117329aae7a7437c96cdc4644d96c65df1'}

          for f,h in baseline.items():
              p=root/f
              if h is None:
                  if p.exists(): raise SystemExit('New proof path already exists unexpectedly: '+f)
              else:
                  if not p.is_file(): raise SystemExit('Expected baseline file missing: '+f)
                  if sha256(p.read_bytes()).hexdigest()!=h:
                      raise SystemExit('Baseline mismatch for '+f+'; refresh live repo before release')
          for f,h in protect.items():
              p=root/f
              if not p.is_file() or sha256(p.read_bytes()).hexdigest()!=h:
                  raise SystemExit('Previously closed asset changed unexpectedly: '+f)

          with ZipFile(payload) as z:
              names=z.namelist()
              if sorted(names)!=sorted(allowed): raise SystemExit('Payload path set mismatch: '+repr(names))
              for info in z.infolist():
                  name=info.filename
                  pp=Path(name)
                  if pp.is_absolute() or '..' in pp.parts: raise SystemExit('Unsafe payload path: '+name)
                  mode=(info.external_attr>>16)&0o170000
                  if mode==S_IFLNK: raise SystemExit('Symlink not allowed: '+name)
                  data=z.read(name)
                  if sha256(data).hexdigest()!=expected[name]: raise SystemExit('Payload hash mismatch: '+name)
              z.extractall('.')
          for f,h in expected.items():
              if sha256((root/f).read_bytes()).hexdigest()!=h: raise SystemExit('Applied hash mismatch: '+f)

          spec=json.loads((root/'assets/ecommerce/pilot-config-isolation-spec-cases.json').read_text(encoding='utf-8'))
          cfgs=spec['configs']
          if len(cfgs)!=2 or len(set(v['namespace'] for v in cfgs.values()))!=2:
              raise SystemExit('Config isolation spec invalid')
          def route(c):
              cfg=cfgs[c['config']]
              if c['missing_required']: return 'STOP_MISSING_FIELD'
              if c['embedded_instruction']: return 'STOP_UNTRUSTED_INSTRUCTION'
              if c['source_conflict']: return 'STOP_SOURCE_CONFLICT'
              if c['source_age_min'] > cfg['max_source_age_min']: return 'STOP_STALE_SOURCE'
              if c['currency'] not in cfg['allowed_currencies']: return 'STOP_CURRENCY_SCOPE'
              if c['action'] not in cfg['autonomous_actions']: return 'HUMAN_APPROVAL'
              if c['amount'] > cfg['human_approval_threshold']: return 'HUMAN_APPROVAL'
              return 'AUTO_QUEUE' if c['action']=='queue' else 'AUTO_TAG'
          results=[(c['id'],route(c),c['expected']) for c in spec['cases']]
          if len(results)!=12 or not all(a==b for _,a,b in results):
              raise SystemExit('Frozen synthetic acceptance result mismatch: '+repr(results))
          if route(spec['cases'][1])!='HUMAN_APPROVAL' or route(spec['cases'][6])!='AUTO_QUEUE':
              raise SystemExit('Threshold differentiation failed')
          if route(spec['cases'][4])!='STOP_CURRENCY_SCOPE' or route(spec['cases'][9])!='AUTO_QUEUE':
              raise SystemExit('Currency differentiation failed')

          proof=root/'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html'
          buyer=root/'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html'
          sector=root/'sektorler/e-ticaret.html'
          for p in (proof,buyer,sector):
              s=p.read_text(encoding='utf-8')
              for bad in ('Day 22','Gün 22','QA PASS','Run Workflow','release.yml','payload.zip','Nike','Red Bull','SATIN ALMA PAKETİ'):
                  if bad.lower() in s.lower(): raise SystemExit('Internal/unwanted public phrase: '+bad+' in '+str(p))
              if re.search(r'\$\s?\d',s): raise SystemExit('Ambiguous USD equivalent remains in '+str(p))
              for value in re.findall(r'\b(?:href|src)=["\']([^"\']+)',s,re.I):
                  if not value or value.startswith(('#','https:','http:','mailto:','tel:','data:')): continue
                  path=unquote(urlsplit(value).path)
                  dest=root/path.lstrip('/') if path.startswith('/') else p.parent/path
                  if not dest.resolve().is_file(): raise SystemExit('Broken local resource '+value+' in '+str(p))

          ps=proof.read_text(encoding='utf-8')
          for phrase in ('Sentetik / teknik örnek','12/12','Canlı müşteri ölçümü','Henüz üretim kullanımı veya ikinci pilot kanıtı yok.','4.900 TL','24.900 TL','Ücretsiz özel geliştirme yapılmaz.'):
              if phrase not in ps: raise SystemExit('Proof boundary/offer missing: '+phrase)
          if ps.count('<tr><td>')!=12: raise SystemExit('Visible synthetic case table must have 12 cases')
          if 'üretim doğruluğu' not in ps or 'güvenlik doğrulaması' not in ps: raise SystemExit('Proof claim boundary missing')

          bs=buyer.read_text(encoding='utf-8')
          if 'Teklif istemeden önce bu 10 soruya cevap alın.' not in bs: raise SystemExit('10-question buyer guide missing')
          for n in range(1,11):
              if '<b>'+str(n)+'</b>' not in bs: raise SystemExit('Buyer question missing: '+str(n))
          for phrase in ('Ortak çekirdek ile mağazaya özel yapılandırma ayrılıyor mu?','Aktivasyon ve ilk değere erişim nasıl ölçülüyor?','e-ticaret-kontrollu-pilot-ornek-raporu.html'):
              if phrase not in bs: raise SystemExit('Buyer guide missing: '+phrase)
          for block in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',bs,re.S|re.I): json.loads(block)
          for block in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',ps,re.S|re.I): json.loads(block)

          url='https://synapseautomate.github.io/kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html'
          sm=(root/'sitemap.xml').read_text(encoding='utf-8'); ET.fromstring(sm)
          if sm.count(url)!=1: raise SystemExit('Sitemap proof URL must be unique')
          ll=(root/'llms.txt').read_text(encoding='utf-8')
          if ll.count(url)!=1 or not ll.endswith('\n') or ll.endswith('\n\n'): raise SystemExit('llms discovery/EOF invalid')
          cm=json.loads((root/'content-manifest.json').read_text(encoding='utf-8'))
          if sum(1 for x in cm.get('resources',[]) if x.get('url')==url)!=1: raise SystemExit('Content manifest proof entry invalid')
          offer=(root/'surec-analizi.html').read_text(encoding='utf-8')
          for price in ('4.900 TL','24.900 TL','14.900 TL'):
              if price not in offer: raise SystemExit('Canonical commercial price missing: '+price)
          if 'G-HQSRRJ5HMZ' not in (root/'assets/js/synapse-measurement-v1.js').read_text(encoding='utf-8'): raise SystemExit('GA4 identity missing')
          print('E-COMMERCE PROOF + BUYER GUIDE: PASS')
          print('Frozen synthetic acceptance: 12/12; live second inbound remains unclaimed')
          PYQA
          git diff --check

      - name: Commit release and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          python3 - <<'PYQA'
          import subprocess
          allowed=set(['assets/ecommerce/pilot-config-isolation-spec-cases.json', 'content-manifest.json', 'kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html', 'llms.txt', 'rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html', 'sektorler/e-ticaret.html', 'sitemap.xml']+['payload.zip','.github/workflows/release.yml'])
          out=subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True)
          seen=set()
          for line in out.splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              seen.add(path)
          unexpected=seen-allowed
          if unexpected: raise SystemExit('Unexpected working-tree changes: '+', '.join(sorted(unexpected)))
          print('WORKTREE SCOPE: PASS')
          PYQA
          git config user.name "synapse-ecommerce-proof-release"
          git config user.email "synapse-ecommerce-proof-release@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "content: deepen e-commerce proof and buyer guidance"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'D01/' --exclude 'D02/' --exclude 'D03/' \
            --exclude '__pycache__/' --exclude '*.zip' \
            --exclude '*.sha256' --exclude '*.py' \
            --exclude 'README*.md' --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/kanit/e-ticaret-kontrollu-pilot-ornek-raporu.html
          test -f _site/assets/ecommerce/pilot-config-isolation-spec-cases.json
          test -f _site/rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html
          test -f _site/sektorler/e-ticaret.html
          test -f _site/surec-analizi.html
          test -f _site/404.html
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
