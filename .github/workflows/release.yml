name: Synapse Price Clarity Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply pricing-only payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, shutil, stat

          page = Path('rehberler/ai-otomasyon-fiyatlari.html')
          zip_path = Path('payload.zip')
          payload_sha = '6df607b9ba11e6abc3884c290c747b8d3426daecfe3bef608f77fe69883fae5b'
          baseline_sha = '601d45a978326f409d0a6198b143882d239f3e872d4f25515893676df25475b6'
          target_sha = '3c1f7337ead338679562167de0cc5d4963aefc95d41a3c00e436403516b94f92'

          def sha(data): return hashlib.sha256(data).hexdigest()
          if not zip_path.is_file() or sha(zip_path.read_bytes()) != payload_sha:
              raise SystemExit('Wrong or missing Day 19 payload.zip')
          if not page.is_file() or sha(page.read_bytes()) not in {baseline_sha, target_sha}:
              raise SystemExit('Pricing page changed since baseline; aborting rather than overwriting newer edits')
          with ZipFile(zip_path) as z:
              members = [x for x in z.infolist() if not x.is_dir()]
              if len(members) != 1 or members[0].filename != page.as_posix():
                  raise SystemExit('Only the existing pricing guide may be changed')
              if stat.S_IFMT(members[0].external_attr >> 16) == stat.S_IFLNK:
                  raise SystemExit('Symlink is not allowed')
              payload_page = z.read(members[0])
          if sha(payload_page) != target_sha:
              raise SystemExit('Unexpected guide content in payload')
          page.write_bytes(payload_page)
          print('PRICE-ONLY PAYLOAD VALIDATION: PASS')
          PY

      - name: Editorial, semantic and funnel quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          import re,json,hashlib,html

          root = Path('.').resolve()
          p = Path('rehberler/ai-otomasyon-fiyatlari.html')
          b = p.read_bytes()
          s = b.decode('utf-8')
          expected_sha = '3c1f7337ead338679562167de0cc5d4963aefc95d41a3c00e436403516b94f92'
          if hashlib.sha256(b).hexdigest() != expected_sha or not b.endswith(b'</html>'):
              raise SystemExit('Pricing guide byte-integrity mismatch')
          for marker in ('id="maliyet-modeli"', 'id="fiyat-etkenleri"',
                         'Varsayımsal örnek:', 'gerçekleşmiş tasarruf',
                         '4.900 TL', '$149', '24.900 TL', '$750', '14.900 TL', '$449',
                         'Süreç Analizi İste', '7/24', 'Bir iş akışının işletim yükünü'):
              if marker not in s: raise SystemExit(f'Editorial requirement missing: {marker}')
          for bad in ('Day 19', 'Gün 19', 'QA PASS', 'Run Workflow', 'release.yml',
                      'payload.zip', 'Nike', 'Red Bull', 'müşteri vaka sonucumuz'):
              if bad.lower() in s.lower():
                  raise SystemExit(f'Internal/unsupported public wording: {bad}')
          area = s.split('id="fiyat-etkenleri"',1)[1].split('</section>',1)[0]
          if len(re.findall(r'<details>', area)) != 17:
              raise SystemExit('Unexpected FAQ count')
          raw = re.search(r'<script type="application/ld\+json">(.*?)</script>', s, flags=re.S)
          if not raw: raise SystemExit('Structured data missing')
          graph = json.loads(raw.group(1))['@graph']
          faq = next(x for x in graph if x.get('@type') == 'FAQPage')
          if len(faq.get('mainEntity',[])) != 9: raise SystemExit('FAQ schema count mismatch')
          for x in faq['mainEntity'][-5:]:
              if x['name'] not in area or html.escape(x['acceptedAnswer']['text']) not in area:
                  raise SystemExit(f'FAQ structured/visible mismatch: {x["name"]}')
          if 'https://synapseautomate.github.io/rehberler/ai-otomasyon-fiyatlari.html' not in s:
              raise SystemExit('Existing canonical changed')
          if not Path('surec-analizi.html').is_file():
              raise SystemExit('Existing paid front door is missing')
          for value in re.findall(r'\b(?:href|src)="([^"]+)"',s):
              if not value or value.startswith(('#','https:','http:','mailto:','tel:','data:')):
                  continue
              path = unquote(urlsplit(value).path)
              dest = root / path.lstrip('/') if path.startswith('/') else root / p.parent / path
              if not dest.resolve().is_file():
                  raise SystemExit(f'Broken local link: {value}')
          print('PRICING + COST MODEL + FUNNEL QA: PASS')
          PY
          git diff --check

      - name: Commit guide and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          git config user.name "synapse-price-release"
          git config user.email "synapse-price-release@users.noreply.github.com"
          git add -- rehberler/ai-otomasyon-fiyatlari.html payload.zip .github/workflows/release.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: clarify pricing drivers and unit cost methodology"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'D01/' \
            --exclude 'D02/' \
            --exclude 'D03/' \
            --exclude '__pycache__/' \
            --exclude '*.zip' \
            --exclude '*.sha256' \
            --exclude '*.py' \
            --exclude 'README*.md' \
            --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/rehberler/ai-otomasyon-fiyatlari.html
          test -f _site/surec-analizi.html
          test -f _site/kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
