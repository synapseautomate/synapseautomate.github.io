name: Synapse Monitoring Scope Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply minimal monitoring payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          from stat import S_IFMT,S_IFLNK
          import json
          allowed=['rehberler/otomasyon-izleme-ve-olay-yonetimi.html', 'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf', 'guven-merkezi.html', 'sitemap.xml', 'llms.txt']
          expected={'rehberler/otomasyon-izleme-ve-olay-yonetimi.html': 'e24d4ef1560c6d7363c1499fac5a9ce28e75d0aecd8b1cc3c7a35b92d6d981a2', 'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf': '2091cb820162628ccbe9bc3f52568eaf150f461173e2270a4ca12321adb21d20', 'guven-merkezi.html': '39d942c2481f9e0ed6f0d8fd4b8ae8f2abbf63d92ec6615ca074c3fcb960ac74', 'sitemap.xml': '8769319fafa8d2c011bc0fa64e65033eb5cc62729ba5016d99219116a9bf9621', 'llms.txt': 'adedfa75a73d739f71d485998f2cf150645443a4e3782b1b0905e6e1f897fb80'}
          baseline={'guven-merkezi.html': 'f74a2d7fccf5a7e5ee18512cac3f768248628186484ad83ed960ef5fa9f5a65a', 'sitemap.xml': '95407c052c61ec95d1cb352ec35faecc96166ea6cd0ee2b3e7a4c7efb66dd0ca', 'llms.txt': 'b1477976bdfafecafe1d90b41c90b2d0ad12374953a3e362a50db3f55f13988f'}
          zip_path=Path('payload.zip')
          def sha(b):return sha256(b).hexdigest()
          if not zip_path.is_file() or sha(zip_path.read_bytes())!='78a90e6e18a7273802421f1610e6c4957cbe9263af7a705c98c0294490a8a221':
              raise SystemExit('Wrong or missing monitoring payload.zip')
          with ZipFile(zip_path) as z:
              entries=[x for x in z.infolist() if not x.is_dir()]
              names=[e.filename for e in entries]
              if len(entries)!=len(allowed) or set(names)!=set(allowed) or len(names)!=len(set(names)):
                  raise SystemExit('Unexpected payload members')
              for e in entries:
                  if e.filename.startswith('/') or '..' in Path(e.filename).parts or S_IFMT(e.external_attr>>16)==S_IFLNK:
                      raise SystemExit('Unsafe ZIP entry')
                  data=z.read(e)
                  if sha(data)!=expected[e.filename]:
                      raise SystemExit('Payload member checksum mismatch: '+e.filename)
                  dst=Path(e.filename)
                  existing=dst.read_bytes() if dst.is_file() else None
                  prev=baseline.get(e.filename)
                  if existing is not None and sha(existing) not in ({prev,expected[e.filename]} if prev else {expected[e.filename]}):
                      raise SystemExit('Live file differs from known baseline; refusing overwrite: '+e.filename)
                  if existing is None and prev:
                      raise SystemExit('Expected existing file missing: '+e.filename)
              for e in entries:
                  dst=Path(e.filename);dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(z.read(e))
          print('CHECKSUM + BASELINE GUARD: PASS')
          PYQA

      - name: Editorial, monitoring, link and discovery QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQA'
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          from xml.etree import ElementTree as ET
          from hashlib import sha256
          import json,re
          root=Path('.').resolve()
          rel='rehberler/otomasyon-izleme-ve-olay-yonetimi.html'
          page=Path(rel)
          source=page.read_text(encoding='utf-8')
          pdf=Path('assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf').read_bytes()
          trust=Path('guven-merkezi.html').read_text(encoding='utf-8')
          llms=Path('llms.txt').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          expected={'rehberler/otomasyon-izleme-ve-olay-yonetimi.html': 'e24d4ef1560c6d7363c1499fac5a9ce28e75d0aecd8b1cc3c7a35b92d6d981a2', 'assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf': '2091cb820162628ccbe9bc3f52568eaf150f461173e2270a4ca12321adb21d20', 'guven-merkezi.html': '39d942c2481f9e0ed6f0d8fd4b8ae8f2abbf63d92ec6615ca074c3fcb960ac74', 'sitemap.xml': '8769319fafa8d2c011bc0fa64e65033eb5cc62729ba5016d99219116a9bf9621', 'llms.txt': 'adedfa75a73d739f71d485998f2cf150645443a4e3782b1b0905e6e1f897fb80'}
          for r,h in expected.items():
              if sha256(Path(r).read_bytes()).hexdigest()!=h:raise SystemExit('File hash changed: '+r)
          for mark in ('lang="tr"','index,follow','İşlem hacmi','İnsan inceleme yükü','Kritik durdurma',
                       'Çizgi, bu şablonda doğrulanmış','Aylık olay hacmi','7/24','14.900 TL',
                       '$449','Süreç Analizi İste','data-synapse-measurement="v1"'):
              if mark not in source:raise SystemExit('Missing visible commitment/scope: '+mark)
          for forbidden in ('Day 20','Gün 20','QA PASS','Run Workflow','release.yml','payload.zip','Red Bull','Nike'):
              if forbidden.lower() in source.lower():raise SystemExit('Internal or unwanted public phrase: '+forbidden)
          assert 'https://synapseautomate.github.io/'+rel in source
          assert source.count('<details>')==6
          m=re.search(r'<script type="application/ld\+json">(.*?)</script>',source,re.S)
          if not m:raise SystemExit('Missing structured data')
          graph=json.loads(m.group(1))['@graph']
          faq=next((e for e in graph if e['@type']=='FAQPage'),None)
          if not faq or len(faq.get('mainEntity',[]))!=4:raise SystemExit('FAQ data invalid')
          for question in faq['mainEntity']:
              if question['name'] not in source or question['acceptedAnswer']['text'] not in source:
                  raise SystemExit('FAQ visible/schema mismatch')
          if not pdf.startswith(b'%PDF-') or not re.search(rb'/Count\s+7\b',pdf):
              raise SystemExit('Invalid 7-page PDF')
          if trust.count('href="'+rel+'"')!=1:
              raise SystemExit('Trust Center discovery link missing')
          if llms.count('https://synapseautomate.github.io/'+rel)!=1:
              raise SystemExit('LLMS discovery link invalid')
          if llms.endswith('\n\n') or not llms.endswith('\n'):
              raise SystemExit('llms trailing whitespace regression')
          ET.fromstring(sitemap)
          if sitemap.count('<loc>https://synapseautomate.github.io/'+rel+'</loc>')!=1:
              raise SystemExit('Sitemap canonical not unique')
          if not Path('surec-analizi.html').is_file() or not Path('assets/js/synapse-measurement-v1.js').is_file():
              raise SystemExit('Existing offer/measurement unexpectedly absent')
          if 'G-HQSRRJ5HMZ' not in Path('assets/js/synapse-measurement-v1.js').read_text():
              raise SystemExit('Measurement identity not found')
          for value in re.findall(r'\b(?:href|src)="([^"]+)"',source):
              if not value or value.startswith(('#','https:','http:','mailto:','tel:','data:')):continue
              path=unquote(urlsplit(value).path)
              dest=root/path.lstrip('/') if path.startswith('/') else (root/page.parent/path)
              if not dest.resolve().is_file():raise SystemExit('Broken relative resource: '+value)
          if 'Disallow: /rehberler/' in Path('robots.txt').read_text(encoding='utf-8'):
              raise SystemExit('New guide blocked by robots')
          if sha256(Path('rehberler/ai-otomasyon-fiyatlari.html').read_bytes()).hexdigest()!='3c1f7337ead338679562167de0cc5d4963aefc95d41a3c00e436403516b94f92':
              raise SystemExit('Day 19 pricing guide changed unexpectedly')
          print('PDF + FAQ + LINK + SITEMAP + GA4 + FUNNEL: PASS')
          PYQA
          # The generated PDF is a binary asset. Git may otherwise interpret it
          # as text and report whitespace in compressed PDF bytes.
          if ! grep -qxF '*.pdf -text -diff' .gitattributes; then
            printf '\n*.pdf -text -diff\n' >> .gitattributes
          fi
          pdf_path=assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf
          test "$(git check-attr text -- "$pdf_path")" = "$pdf_path: text: unset"
          test "$(git check-attr diff -- "$pdf_path")" = "$pdf_path: diff: unset"
          git diff --check

      - name: Commit minimal release and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f payload.zip .github/workflows/release.yml
          git config user.name "synapse-monitoring-release"
          git config user.email "synapse-monitoring-release@users.noreply.github.com"
          git add -- \
            .gitattributes \
            rehberler/otomasyon-izleme-ve-olay-yonetimi.html \
            assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf \
            guven-merkezi.html sitemap.xml llms.txt \
            payload.zip .github/workflows/release.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: clarify automation monitoring and monthly operating boundaries"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/             --exclude '.git/'             --exclude '.github/'             --exclude '_site/'             --exclude 'D01/' --exclude 'D02/' --exclude 'D03/'             --exclude '__pycache__/' --exclude '*.zip'             --exclude '*.sha256' --exclude '*.py'             --exclude 'README*.md' --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/rehberler/otomasyon-izleme-ve-olay-yonetimi.html
          test -f _site/assets/reports/Synapse_MVPde_Neyi_Izliyoruz.pdf
          test -f _site/surec-analizi.html
          test -f _site/kanit/gayrimenkul-bakim-onceliklendirme-before-after-spec.html
          test -f _site/rehberler/ai-otomasyon-fiyatlari.html
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .
          echo "CLEAN PUBLIC PAGES ARTIFACT: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
