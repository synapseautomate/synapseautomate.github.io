name: Publish Synapse Corporate Site V3.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synapse-corporate-site-v32
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Locate and inspect package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package='./SYNAPSE_AUTOMATE_CORPORATE_SITE_V3_2.zip'
          test -f "$package"
          unzip -t "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Outer ZIP SHA-256: $(sha256sum "$package" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Create rollback branch
        shell: bash
        run: |
          set -euo pipefail
          rollback="rollback/pre-corporate-v32-${GITHUB_RUN_ID}"
          git branch "$rollback" HEAD
          git push origin "$rollback"
          echo "Rollback branch: $rollback" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract and verify content manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/synapse-site-v32
          mkdir -p /tmp/synapse-site-v32
          unzip -q "${{ steps.package.outputs.package }}" -d /tmp/synapse-site-v32
          site_root=/tmp/synapse-site-v32/synapse_site_v3
          test -f "$site_root/index.html"
          test -f "$site_root/BUILD_MANIFEST.sha256"
          test ! -e "$site_root/.github"
          cd "$site_root"
          sha256sum -c BUILD_MANIFEST.sha256
          rm -f BUILD_MANIFEST.sha256

      - name: Run source-completeness QA
        shell: bash
        run: |
          set -euo pipefail
          site_root=/tmp/synapse-site-v32/synapse_site_v3
          python3 "$site_root/scripts/site_qa.py"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/synapse-site-v32/synapse_site_v3')
          binary = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico'}
          bad = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() in binary:
                  continue
              try:
                  path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  bad.append(str(path.relative_to(root)))
          if bad:
              raise SystemExit('Non-UTF-8 files: ' + ', '.join(bad))
          print('UTF8 PASS')
          PY
          if grep -RInE '[[:blank:]]+$' "$site_root" \
            --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            --exclude='*.webp' --exclude='*.gif' --exclude='*.ico'; then
            echo 'Trailing whitespace detected in package.' >&2
            exit 1
          fi
          pattern='sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}'
          ! grep -RInE "$pattern" "$site_root" --exclude-dir=.git

      - name: Replace public site content
        shell: bash
        run: |
          set -euo pipefail
          site_root=/tmp/synapse-site-v32/synapse_site_v3

          # Preserve repository metadata and all workflow definitions.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a "$site_root"/. .

          # Packages are deployment transport only; never publish them.
          rm -f SYNAPSE_AUTOMATE_CORPORATE_SITE_V3*.zip

          python3 scripts/site_qa.py
          git diff --check

      - name: Commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'synapse-site-bot'
          git config user.email 'synapse-site-bot@users.noreply.github.com'

          git add -A -- . ':(exclude).github/**'

          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo 'Refusing to modify .github from site publisher.' >&2
            exit 1
          fi

          git diff --cached --check
          git diff --cached --quiet || git commit -m 'feat: publish corporate site v3.2'
          git push origin HEAD:main
