name: V8 Day20 Single FAQ Chromium + Before After QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'rehberler/ai-otomasyon-fiyatlari.html'
      - 'scripts/v8_g20_faq_browser_qa.py'
      - '.github/workflows/v8-gun20-single-faq-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/v8_g20_faq_browser_qa.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g20-single-faq-before-after
          path: operasyon/v8/gun-20/browser-evidence/
          if-no-files-found: warn
