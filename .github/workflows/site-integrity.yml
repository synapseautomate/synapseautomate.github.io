name: Site Integrity QA

'on':
  push:
    branches:
      - main
      - 'ops/discoverability-2026-10-07'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public site graph
        run: python scripts/site_integrity.py
      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-integrity-report
          path: /tmp/site-integrity-report.json
          if-no-files-found: error
