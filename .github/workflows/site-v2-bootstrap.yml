name: Publish Synapse Corporate Site V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synapse-corporate-site-v2
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate and verify package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'SYNAPSE_AUTOMATE_CORPORATE_SITE_V2*.zip' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one corporate site package, found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]:-}" >&2
            exit 1
          fi
          package="${packages[0]}"
          echo '58fb787fc084c5097cdc7319e2e9b4145d7f558d6e04ca365e010a12c73833c6  '"$package" | sha256sum -c -
          unzip -t "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Create rollback branch
        shell: bash
        run: |
          set -euo pipefail
          rollback="rollback/pre-corporate-v2-${GITHUB_RUN_ID}"
          git branch "$rollback" HEAD
          git push origin "$rollback"
          echo "Rollback branch: $rollback" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract and run site QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/synapse-site-v2
          mkdir -p /tmp/synapse-site-v2
          unzip -q "${{ steps.package.outputs.package }}" -d /tmp/synapse-site-v2
          site_root=/tmp/synapse-site-v2/synapse_site_v2
          test -f "$site_root/index.html"
          test -f "$site_root/scripts/site_qa.py"
          python3 "$site_root/scripts/site_qa.py"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/synapse-site-v2/synapse_site_v2')
          bad = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.ico'}:
                  continue
              try:
                  path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  bad.append(str(path.relative_to(root)))
          if bad:
              raise SystemExit('Non-UTF-8 files: ' + ', '.join(bad))
          print('UTF8 PASS')
          PY
          pattern='sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}'
          ! grep -RInE "$pattern" "$site_root" --exclude-dir=.git

      - name: Replace repository with verified site
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.package.outputs.package }}"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/synapse-site-v2/synapse_site_v2/. .
          python3 scripts/site_qa.py
          git diff --check

      - name: Commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'synapse-site-bot'
          git config user.email 'synapse-site-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'feat: launch corporate Synapse Automate site v2'
          git push origin HEAD:main
          echo "Published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
