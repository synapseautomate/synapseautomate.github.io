name: Synapse Day17 Onboarding Risk Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed payload
        shell: bash
        run: |
          echo "ff1f4f06261c325ac4bd50fffe1ed5950e473c2b38020e9d13a36c565dba60c2  .github/workflows/synapse-day17-onboarding-risk-payload.zip" | sha256sum -c -
          rm -rf /tmp/synapse-day17 && mkdir -p /tmp/synapse-day17
          unzip -q .github/workflows/synapse-day17-onboarding-risk-payload.zip -d /tmp/synapse-day17
      - name: Preflight
        run: python3 /tmp/synapse-day17/preflight.py "$GITHUB_WORKSPACE"
      - name: Apply verified release
        run: python3 /tmp/synapse-day17/apply.py "$GITHUB_WORKSPACE"
      - name: Quality gate
        run: python3 /tmp/synapse-day17/qa.py "$GITHUB_WORKSPACE"
      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "synapseautomate"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/synapse-day17-onboarding-risk-release.yml .github/workflows/synapse-day17-onboarding-risk-payload.zip
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: onboarding risk and comparison proof"
          git push
