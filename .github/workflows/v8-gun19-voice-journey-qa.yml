name: V8 Day19 Voice AI Journey Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'hizmetler.html'
      - 'iletisim.html'
      - 'surec-analizi.html'
      - 'cozumler/sesli-yapay-zeka-randevu-insan-devri.html'
      - 'scripts/v8_gun19_browser_qa.py'
      - 'scripts/v8_gun19_before_after.py'
      - 'scripts/v8_gun19_live_http.py'
      - '.github/workflows/v8-gun19-voice-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-viewports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/v8_gun19_browser_qa.py
      - run: python scripts/v8_gun19_before_after.py
      - run: python scripts/v8_gun19_live_http.py
      - name: Evidence screenshots + JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-gun19-six-viewports
          path: |
            operasyon/v8/gun-19/qa-browser-artifacts/
            operasyon/v8/gun-19/qa-before-after/
          if-no-files-found: warn
