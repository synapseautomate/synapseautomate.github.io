name: Publish Synapse Day 3 Inbound + Finance + AI Search

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate exactly one Day 3 package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 2 -type f -name 'SYNAPSE_DAY3_IMPLEMENTATION_V1.zip' -print)
          test "${#zips[@]}" -eq 1 || { echo "Expected exactly one package, found ${#zips[@]}"; exit 1; }
          echo "DAY3_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .day3_pkg
          mkdir .day3_pkg
          unzip -q "$DAY3_ZIP" -d .day3_pkg
          test -f .day3_pkg/day3_apply.py
          test -f .day3_pkg/day3_qa.py

      - name: Apply Day 3 changes
        shell: bash
        run: |
          set -euo pipefail
          python .day3_pkg/day3_apply.py "$GITHUB_WORKSPACE"
          cp -R .day3_pkg/D03 "$GITHUB_WORKSPACE/"

      - name: Day 3 QA
        shell: bash
        run: |
          set -euo pipefail
          python .day3_pkg/day3_qa.py "$GITHUB_WORKSPACE"

      - name: Remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .day3_pkg
          rm -f "$DAY3_ZIP"
          rm -f .github/workflows/site-d03-patch-publish.yml || true

      - name: Commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "synapseautomate"
          git config user.email "synapseautomate.ai@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Day 3: finance inbound, tools, SEO and AI-search foundation"
          git push origin main
