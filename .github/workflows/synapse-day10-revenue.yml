      - name: Revenue alignment QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          files = [
              Path('sektorler/e-ticaret.html'),
              Path('rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html'),
              Path('surec-analizi.html'),
          ]
          errors=[]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.append(d['id'])
                  if tag=='a' and 'href' in d: self.links.append(d['href'])
          for f in files:
              text=f.read_text(encoding='utf-8')
              if '\ufffd' in text: errors.append(f'{f}: UTF-8 replacement char')
              if 'synapseautomate.com' in text: errors.append(f'{f}: wrong domain')
              for bad in ['day 10','gün 10','public benchmark','v1.0.0','lorem ipsum']:
                  if bad in text.lower(): errors.append(f'{f}: internal marker {bad}')
              p=P(); p.feed(text)
              if len(p.ids)!=len(set(p.ids)): errors.append(f'{f}: duplicate id')
              for href in p.links:
                  if href.startswith(('https://','http://','mailto:','#','javascript:')): continue
                  path=urlsplit(href).path
                  if not path: continue
                  target=(f.parent/path).resolve()
                  if not target.exists(): errors.append(f'{f}: broken local link {href}')
          et=Path('sektorler/e-ticaret.html').read_text(encoding='utf-8')
          if '4.900 TL / $149' not in et or 'ecommerce-revenue' not in et:
              errors.append('e-commerce: price/campaign alignment missing')
          sa=Path('surec-analizi.html').read_text(encoding='utf-8')
          for token in ['lead-source','utm_source','lead-campaign','Giris_Sayfasi']:
              if token not in sa: errors.append(f'process analysis: missing {token}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('Revenue QA PASS')
          PY
          git diff --check

      - name: Commit reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "synapseautomate"
          git config user.email "synapseautomate.ai@gmail.com"
          git add sektorler/e-ticaret.html rehberler/e-ticaret-ai-otomasyon-satin-alma-rehberi.html surec-analizi.html
          git commit -m "Align ecommerce revenue funnel and source attribution"
          git push
