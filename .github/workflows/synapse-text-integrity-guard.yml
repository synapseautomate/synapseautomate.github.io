name: Synapse Site Text Integrity Repair + Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - '**/*.txt'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.js'
      - '**/*.css'
      - '**/*.svg'
      - '**/*.md'
      - '**/*.csv'
      - '**/*.webmanifest'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: synapse-text-integrity
  cancel-in-progress: false

jobs:
  text-integrity:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create rollback branch for manual repair
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rollback="rollback/pre-text-integrity-${GITHUB_RUN_ID}"
          git branch "$rollback"
          git push origin "$rollback"
          echo "Rollback branch: $rollback" >> "$GITHUB_STEP_SUMMARY"

      - name: Repair high-confidence text corruption and audit all public text
        shell: bash
        env:
          REPAIR_MODE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html as html_lib
          import os, re, unicodedata, json

          ROOT = Path('.').resolve()
          REPAIR = os.environ.get('REPAIR_MODE') == '1'
          EXCLUDED_PARTS = {
              '.git', '.github', '_site', '__pycache__', 'node_modules',
              'D01', 'D02', 'D03', '.text_integrity_tmp'
          }
          PUBLIC_SUFFIXES = {'.html', '.htm', '.txt', '.xml', '.json', '.js', '.css', '.svg', '.md', '.csv', '.webmanifest'}

          TURKISH_LETTERS = 'A-Za-zÇĞİÖŞÜçğıöşü'
          EMBEDDED_AI = re.compile(
              rf'(?P<left>[{TURKISH_LETTERS}])\s*(?:yapay\s+zek(?:â|a))\s*(?P<right>[{TURKISH_LETTERS}])',
              re.IGNORECASE
          )
          BROKEN_FAIL = re.compile(r'\bF\s*yapay\s+zek(?:â|a)\s*L\b', re.IGNORECASE)
          TECH_STACK_VOWEL = re.compile(r'\b(?P<base>Teknoloji\s+Yapısı)[ıiuü]\b', re.IGNORECASE)
          TECH_STACK_GEN = re.compile(r'\bTeknoloji\s+Yapısı(?:ın|in|un|ün)\b', re.IGNORECASE)
          TECH_STACK_DAT = re.compile(r'\bTeknoloji\s+Yapısı(?:a|e)\b', re.IGNORECASE)
          TECH_STACK_LOC = re.compile(r'\bTeknoloji\s+Yapısı(?:da|de)\b', re.IGNORECASE)
          TECH_STACK_ABL = re.compile(r'\bTeknoloji\s+Yapısı(?:dan|den)\b', re.IGNORECASE)

          MOJIBAKE = {
              'Ã§':'ç','Ã‡':'Ç','ÄŸ':'ğ','Äž':'Ğ','Ä±':'ı','Ä°':'İ',
              'Ã¶':'ö','Ã–':'Ö','Ã¼':'ü','Ãœ':'Ü','ÅŸ':'ş','Åž':'Ş',
              'â€™':'’','â€˜':'‘','â€œ':'“','â€':'”','â€“':'–','â€”':'—',
              'â€¦':'…','Â ':' ','Â·':'·','Â':'',
          }
          MOJIBAKE_MARKERS = tuple(MOJIBAKE.keys()) + ('Ã', 'Ä', 'Å', 'â€', 'Â')
          ZERO_WIDTH = ('\u200b','\u200c','\u200d','\u2060','\ufeff')

          EXACT = {
              'PASS/Fyapay zekâL': 'PASS/FAIL',
              'PASS / Fyapay zekâL': 'PASS/FAIL',
              'PASS/Fyapay zekaL': 'PASS/FAIL',
              'PASS / Fyapay zekaL': 'PASS/FAIL',
              'Teknoloji Yapısıu': 'Teknoloji Yapısı',
              'Teknoloji Yapısıı': 'Teknoloji Yapısı',
              'Teknoloji Yapısıi': 'Teknoloji Yapısı',
              'Teknoloji Yapısıü': 'Teknoloji Yapısı',
          }

          def public_candidate(p: Path) -> bool:
              if not p.is_file():
                  return False
              rel = p.relative_to(ROOT)
              if any(part in EXCLUDED_PARTS for part in rel.parts):
                  return False
              if p.suffix.lower() not in PUBLIC_SUFFIXES:
                  return False
              # Google verification files are intentionally machine-formatted.
              if re.fullmatch(r'google[a-z0-9_-]+\.html', p.name.lower()):
                  return False
              return True

          def repair_mojibake(s: str) -> str:
              # Apply only known unambiguous UTF-8/Latin-1 artifacts.
              for _ in range(3):
                  before = s
                  for bad, good in MOJIBAKE.items():
                      s = s.replace(bad, good)
                  if s == before:
                      break
              return s

          def repair_embedded_ai(s: str) -> str:
              # This specifically reverses the damaging class where a bulk AI ->
              # "yapay zekâ" conversion was applied inside ordinary words.
              def repl(m):
                  left, right = m.group('left'), m.group('right')
                  ai = 'AI' if left.isupper() and right.isupper() else 'ai'
                  return left + ai + right
              for _ in range(8):
                  new = EMBEDDED_AI.sub(repl, s)
                  if new == s:
                      break
                  s = new
              return s

          def repair_text(s: str) -> str:
              s = unicodedata.normalize('NFC', s)
              for ch in ZERO_WIDTH:
                  s = s.replace(ch, '')
              s = repair_mojibake(s)
              for bad, good in EXACT.items():
                  s = s.replace(bad, good)
              s = BROKEN_FAIL.sub('FAIL', s)
              s = repair_embedded_ai(s)
              s = TECH_STACK_GEN.sub('Teknoloji Yapısının', s)
              s = TECH_STACK_DAT.sub('Teknoloji Yapısına', s)
              s = TECH_STACK_LOC.sub('Teknoloji Yapısında', s)
              s = TECH_STACK_ABL.sub('Teknoloji Yapısından', s)
              s = TECH_STACK_VOWEL.sub(lambda m: m.group('base'), s)
              return unicodedata.normalize('NFC', s)

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {'script','style'}:
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag.lower() in {'script','style'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          files = sorted(p for p in ROOT.rglob('*') if public_candidate(p))
          if not files:
              raise SystemExit('No public text-bearing files found')

          changed = []
          decode_errors = []
          for p in files:
              raw = p.read_bytes()
              try:
                  text = raw.decode('utf-8-sig')
              except UnicodeDecodeError as e:
                  decode_errors.append((p, str(e)))
                  continue
              fixed = repair_text(text)
              if REPAIR and fixed != text:
                  p.write_text(fixed, encoding='utf-8', newline='\n')
                  changed.append(p.relative_to(ROOT).as_posix())

          # Re-read post-repair content and perform hard QA.
          hard = []
          soft = []

          def add(issue_list, p, line_no, label, context):
              context = ' '.join(context.strip().split())[:240]
              issue_list.append((p.relative_to(ROOT).as_posix(), line_no, label, context))

          for p, err in decode_errors:
              add(hard, p, 1, 'non-UTF-8 file', err)

          for p in files:
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              lines = text.splitlines() or ['']
              for i, line in enumerate(lines, 1):
                  if '\ufffd' in line:
                      add(hard, p, i, 'Unicode replacement character', line)
                  if any(ch in line for ch in ZERO_WIDTH):
                      add(hard, p, i, 'zero-width/BOM artifact', line)
                  if any(mark in line for mark in MOJIBAKE_MARKERS):
                      add(hard, p, i, 'mojibake/encoding artifact', line)
                  if EMBEDDED_AI.search(line):
                      add(hard, p, i, 'AI bulk-replacement leaked inside a word', line)
                  if BROKEN_FAIL.search(line) or re.search(r'PASS\s*/\s*F\s*yapay', line, re.I):
                      add(hard, p, i, 'broken PASS/FAIL token', line)
                  if re.search(r'\bTeknoloji\s+Yapısı(?:[ıiuü]|ın|in|un|ün|a|e|da|de|dan|den)\b', line, re.I):
                      add(hard, p, i, 'broken Teknoloji Yapısı suffix', line)
                  if any(ord(c) < 32 and c not in '\t\r\n' for c in line):
                      add(hard, p, i, 'control character', line)

              if p.suffix.lower() in {'.html','.htm'}:
                  low = text.lower()
                  if '<meta charset="utf-8"' not in low and "<meta charset='utf-8'" not in low:
                      add(hard, p, 1, 'missing UTF-8 charset declaration', '<head>')
                  parser = VisibleText()
                  try:
                      parser.feed(text)
                      visible = html_lib.unescape(' '.join(parser.parts))
                  except Exception as e:
                      add(hard, p, 1, 'HTML parse failure', str(e))
                      visible = ''
                  for marker in ('[object Object]', 'undefined undefined', 'Lorem ipsum', '�'):
                      if marker in visible:
                          line_no = text[:text.find(marker)].count('\n') + 1 if marker in text else 1
                          add(hard, p, line_no, 'visible placeholder/runtime artifact', marker)
                  # Soft-only clues: report, but do not mutate legitimate Turkish morphology.
                  for m in re.finditer(r'\b[\wÇĞİÖŞÜçğıöşü]{3,}(?:ıu|ıü|üı|uı)[\wÇĞİÖŞÜçğıöşü]*\b', visible, re.I):
                      soft.append((p.relative_to(ROOT).as_posix(), 'unusual vowel sequence', m.group(0)))

          # De-duplicate diagnostics.
          hard = list(dict.fromkeys(hard))
          soft = list(dict.fromkeys(soft))

          print(f'TEXT INTEGRITY SCAN: {len(files)} public text-bearing file(s)')
          print(f'REPAIR MODE: {REPAIR}')
          print(f'FILES CHANGED: {len(changed)}')
          for rel in changed[:100]:
              print('  FIXED', rel)

          report = []
          report.append('# Synapse Text Integrity Report')
          report.append('')
          report.append(f'- Files scanned: {len(files)}')
          report.append(f'- Repair mode: {REPAIR}')
          report.append(f'- Files changed: {len(changed)}')
          report.append(f'- Hard unresolved issues: {len(hard)}')
          report.append(f'- Soft review clues: {len(soft)}')
          report.append('')
          if changed:
              report.append('## Changed files')
              report.extend(f'- `{x}`' for x in changed)
              report.append('')
          if hard:
              report.append('## HARD FAILURES')
              for rel, line, label, ctx in hard:
                  report.append(f'- `{rel}:{line}` — **{label}** — {ctx}')
              report.append('')
          if soft:
              report.append('## Soft review clues')
              for rel, label, token in soft[:200]:
                  report.append(f'- `{rel}` — {label}: `{token}`')
              report.append('')

          report_path = Path(os.environ.get('RUNNER_TEMP', '.')) / 'synapse-text-integrity-report.md'
          report_path.write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as f:
              f.write('\n'.join(report) + '\n')

          if hard:
              for rel, line, label, ctx in hard[:50]:
                  print(f'::error file={rel},line={line}::{label}: {ctx}')
              raise SystemExit(f'TEXT INTEGRITY QA: FAIL — {len(hard)} unresolved hard issue(s)')

          print('TEXT INTEGRITY QA: PASS')
          PY

          git diff --check

      - name: Run existing site QA when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/site_qa.py ]; then
            python3 scripts/site_qa.py
          else
            echo "scripts/site_qa.py not present; text-integrity QA remains authoritative."
          fi
          git diff --check

      - name: Commit repaired text to main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "synapse-text-integrity"
          git config user.email "synapse-text-integrity@users.noreply.github.com"
          git add -A -- . ':(exclude).github/**' ':(exclude)_site/**'
          git reset -q HEAD -- .github 2>/dev/null || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No text corrections were required."
          else
            git commit -m "fix: repair site-wide text integrity corruption"
            git push origin HEAD:main
          fi

      - name: Build clean public Pages artifact
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'D01/' \
            --exclude 'D02/' \
            --exclude 'D03/' \
            --exclude '__pycache__/' \
            --exclude 'node_modules/' \
            --exclude '*.zip' \
            --exclude '*.sha256' \
            --exclude '*.py' \
            --exclude 'README*.md' \
            --exclude 'DEPLOYMENT.md'

          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/llms.txt
          ! grep -RInE 'PASS[[:space:]]*/[[:space:]]*F[[:space:]]*yapay|Teknoloji[[:space:]]+Yapısı[ıiuü]' _site --include='*.html' --include='*.txt' --include='*.json' --include='*.xml' --include='*.js' --include='*.css' --include='*.svg' --include='*.md' --include='*.csv' || {
            echo 'Public artifact still contains known corruption.' >&2
            exit 1
          }
          echo "PUBLIC TEXT-INTEGRITY ARTIFACT QA: PASS"

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy repaired site to GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Text Integrity Guard"
            echo "- Event: ${{ github.event_name }}"
            echo "- Manual run repairs high-confidence corruption and redeploys."
            echo "- Push/scheduled runs audit without silently changing ambiguous language."
            echo "- Future broad AI text substitutions are blocked if they leak inside ordinary words."
          } >> "$GITHUB_STEP_SUMMARY"
