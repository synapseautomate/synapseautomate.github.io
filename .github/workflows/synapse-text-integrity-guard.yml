name: Synapse Text Integrity Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair and audit text
        run: python3 scripts/synapse_text_repair.py

      - name: Commit repairs
        run: |
          git config user.name "synapse-text-repair"
          git config user.email "synapse-text-repair@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repairs needed."
          else
            git commit -m "fix: repair site-wide text integrity issues"
            git push
          fi
