name: Day19 Original Voice AI Concept Videos
'on':
  push:
    branches:
      - release/g19-voice-video-assets-20261028
    paths:
      - '.github/workflows/g19-voice-social-assets.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g19-voice-social-assets.yml'
      - 'scripts/v8_g19_voice_media.py'
permissions:
  contents: write
jobs:
  render-and-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/g19-voice-video-assets-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free render dependencies
        run: |
          python -m pip install Pillow
          command -v ffmpeg
          command -v ffprobe
      - name: Render original concept films, without fake product interfaces
        run: |
          python scripts/v8_g19_voice_media.py
          cat > assets/media/g19/voice-handoff-horizontal.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:06,000
          Bir konuşmayı anlamak, randevuyu onaylamak değildir.
          2
          00:00:06,000 --> 00:00:12,000
          Yarın saat on için uygunluk teyit edilmeden söz verilmez.
          3
          00:00:12,000 --> 00:00:18,000
          Destek talebi ilgili ekibe aktarılmak üzere sınıflandırılır.
          4
          00:00:18,000 --> 00:00:24,000
          Hassas veya belirsiz bir soruda insan temsilci devralır.
          5
          00:00:24,000 --> 00:00:30,000
          Otomatik rezervasyon ve gerçek çağrı kaydı gösterilmiyor.
          6
          00:00:30,000 --> 00:00:36,000
          SYNAPSE Automate: Karar hakkı sizde.
          EOF
          cat > assets/media/g19/voice-handoff-vertical.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:05,000
          Bir konuşmayı anlamak, randevuyu onaylamak değildir.
          2
          00:00:05,000 --> 00:00:10,000
          Takvim teyidi yoksa rezervasyon kesinleşmez.
          3
          00:00:10,000 --> 00:00:15,000
          Destek talebi yetkili ekibe yönlendirilir.
          4
          00:00:15,000 --> 00:00:20,000
          Belirsizlikte insan temsilci devralır.
          5
          00:00:20,000 --> 00:00:25,000
          Bu sentetik kavramsal örnektir.
          6
          00:00:25,000 --> 00:00:30,000
          SYNAPSE Automate: Karar hakkı sizde.
          EOF
      - name: Decode, inspect sizes and inspect frame images
        run: |
          set -euo pipefail
          mkdir -p /tmp/voice-qa
          for name in horizontal vertical; do
            f="assets/media/g19/synapse-voice-human-handoff-$name.mp4"
            test -s "$f"
            ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -show_entries format=duration,size -of json "$f" > "/tmp/voice-qa/$name.json"
            ffmpeg -v error -i "$f" -f null -
            ffmpeg -v error -ss 12 -i "$f" -frames:v 1 -y "/tmp/voice-qa/$name.png"
            sha256sum "$f" >> "/tmp/voice-qa/SHA256SUMS.txt"
          done
          cat /tmp/voice-qa/*.json
      - name: Commit verified public MP4 and subtitles to release branch
        run: |
          git config user.name "synapse-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/g19/
          git diff --cached --quiet && exit 0
          git commit -m "media(g19): add two decoded synthetic voice AI MP4 with subtitles"
          git push origin HEAD:release/g19-voice-video-assets-20261028
      - name: Store independent QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day19-voice-social-qa
          path: /tmp/voice-qa/
          if-no-files-found: warn
