      - name: Flagship brand and reputation gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FLAG_QA'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json, re, sys
          pages=[Path('index.html'),Path('kaynaklar.html'),Path('standards/enterprise-ai-workflow-reliability-standard-2026.html')]
          errors=[]
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for attr in ('href','src'):
                      if d.get(attr): self.refs.append(d[attr])
              def handle_data(self,data): self.text.append(data)
          for p in pages:
              raw=p.read_text(encoding='utf-8'); q=P(); q.feed(raw); visible=' '.join(q.text)
              if '\ufffd' in raw: errors.append(f'bad unicode: {p}')
              if not re.search(r'<title>[^<]+</title>',raw,re.I): errors.append(f'missing title: {p}')
              if not re.search(r'<meta[^>]+name=["\']description["\'][^>]+>',raw,re.I): errors.append(f'missing description: {p}')
              for ref in q.refs:
                  if ref.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')): continue
                  path=urlsplit(ref).path
                  if not path: continue
                  target=Path(path.lstrip('/')) if path.startswith('/') else (p.parent/path)
                  if not target.exists(): errors.append(f'broken local ref {p} -> {ref}')
              for bad in ('Day 12','ChatGPT 5.6','100% accurate','guaranteed ROI','NIST approved','ISO certified','OWASP endorsed'):
                  if bad.lower() in visible.lower(): errors.append(f'forbidden public wording {bad}: {p}')
          std=Path('standards/enterprise-ai-workflow-reliability-standard-2026.html').read_text(encoding='utf-8')
          for token in ('AUTO_PROCEED','HUMAN_REVIEW','HUMAN_APPROVAL','STOP_ESCALATE','R10','Not a certification claim','100/100','50/50','Download the 8-page standard'):
              if token not in std: errors.append('standard missing '+token)
          try: json.loads(Path('public-proof/enterprise-reliability-standard-2026/evidence-map.json').read_text(encoding='utf-8'))
          except Exception as e: errors.append('bad evidence map: '+str(e))
          pdf=Path('assets/reports/Synapse_Enterprise_AI_Workflow_Reliability_Standard_2026.pdf')
          if not pdf.is_file() or pdf.stat().st_size < 150000 or not pdf.read_bytes().startswith(b'%PDF-'):
              errors.append('standard PDF failed binary sanity gate')
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          canon='https://synapseautomate.github.io/standards/enterprise-ai-workflow-reliability-standard-2026.html'
          if sm.count(canon)!=1: errors.append('flagship sitemap canonical count != 1')
          if errors:
              print('FLAGSHIP QA FAIL')
              for e in errors: print('-',e)
              sys.exit(34)
          print('PASS: flagship brand/link/claim/PDF gate')
          PY_FLAG_QA
          git diff --check

