                  if tag=='a' and d.get('href'): self.links.append(d['href'])
              def handle_data(self,data): self.text.append(data)
          for p in public:
              raw=p.read_text(encoding='utf-8'); parser=Parser(); parser.feed(raw)
              visible=re.sub(r'\s+',' ',' '.join(parser.text))
              if '\ufffd' in raw: errors.append(f'{p}: replacement glyph')
              for forbidden in ('Day 12','Gün 12','public proof','ChatGPT','assistant instruction','user instruction','synapseautomate.com'):
                  if forbidden.lower() in visible.lower(): errors.append(f'{p}: forbidden customer-facing token {forbidden}')
              if 'assets/brand/synapse-logo-clean.png' not in raw: errors.append(f'{p}: clean logo missing')
              if not re.search(r'<title>[^<]+</title>',raw,re.I): errors.append(f'{p}: title missing')
              if not re.search(r'<meta[^>]+name=["\']description["\'][^>]+>',raw,re.I): errors.append(f'{p}: description missing')
              if not re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+>',raw,re.I): errors.append(f'{p}: canonical missing')
              for href in parser.links:
                  h=urllib.parse.urlsplit(href)
                  if h.scheme in ('http','https','mailto','tel') or href.startswith('#'): continue
                  if not h.path: continue
                  target=Path(h.path.lstrip('/')) if h.path.startswith('/') else p.parent/h.path
                  if not target.exists(): errors.append(f'{p}: broken local link {href}')
              for m in re.finditer(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',raw,re.S|re.I):
                  try: data=json.loads(m.group(1))
                  except Exception as e: errors.append(f'{p}: bad JSON-LD {e}'); continue
                  if isinstance(data,dict) and data.get('@type')=='FAQPage':
                      for q in data.get('mainEntity',[]):
                          qt=re.sub(r'\s+',' ',q.get('name','')).strip()
                          ans=re.sub(r'\s+',' ',q.get('acceptedAnswer',{}).get('text','')).strip()
                          if qt and qt not in visible: errors.append(f'{p}: FAQ question not visible: {qt}')
                          if ans and ans not in visible: errors.append(f'{p}: FAQ answer not visible: {qt}')
          decision=Path('rehberler/insan-onayi-escalation-karar-tablosu.html').read_text(encoding='utf-8')
          for state in ('AUTO_PROCEED','HUMAN_REVIEW','HUMAN_APPROVAL','STOP_ESCALATE'):
              if state not in decision: errors.append('decision table missing '+state)
          if len(re.findall(r'<details(?:\s|>)',decision,re.I))!=8: errors.append('decision page visible FAQ count != 8')
          guide=Path('rehberler/finans-ai-otomasyonu-guvenli-baslangic.html').read_text(encoding='utf-8')
          if len(re.findall(r'<details(?:\s|>)',guide,re.I))!=6: errors.append('finance guide visible FAQ count != 6')
          for phrase in ('İnsan onayı','Yanlış kesinlik','Kaynak doğrulama'):
              if phrase not in guide: errors.append('finance guide missing '+phrase)
          tool=Path('araclar/finans-surec-kontrol-listesi.html').read_text(encoding='utf-8')
          if len(re.findall(r'type=["\']checkbox["\'][^>]*data-check',tool,re.I))!=8: errors.append('finance checklist controls != 8')
          if not ('tavsiye' in tool.lower() and 'vermez' in tool.lower()): errors.append('finance checklist advice boundary missing')
          card=Path('kanit/ornek-insan-onay-karti.html').read_text(encoding='utf-8')
          for token in ('data-act="ONAYLA"','data-act="DÜZENLE"','data-act="REDDET"','data-act="DEVRET"','dış sistem yazımı: kapalı'):
              if token not in card: errors.append('approval card missing '+token)
          sm=Path('sitemap.xml').read_text(encoding='utf-8'); urls=re.findall(r'<loc>(.*?)</loc>',sm)
          if len(urls)!=len(set(urls)): errors.append('duplicate sitemap URLs')
          for p in public:
              u='https://synapseautomate.github.io/'+p.as_posix()
              if urls.count(u)!=1: errors.append(f'sitemap count for {u} = {urls.count(u)}')
          paid=Path('surec-analizi.html').read_text(encoding='utf-8'); m=re.search(r'<form\b.*?</form>',paid,re.I|re.S)
          if not m: errors.append('Process Analysis form missing')
          else:
              required=len(re.findall(r'<(?:input|textarea|select)\b[^>]*\brequired\b',m.group(0),re.I))
              if required>10: errors.append(f'Process Analysis required fields={required} > 10')
          timing=Path('public-proof/human-approval/time-cost-table.csv').read_text(encoding='utf-8')
          if re.search(r',0(?:\.0+)?,.*unmeasured',timing,re.I): errors.append('unmeasured time coerced to zero')
          readme=Path('public-proof/human-approval/README.md').read_text(encoding='utf-8')
          if 'time to approved result' not in readme.lower(): errors.append('approved-result-time metric missing')
          if errors:
              print('QA FAIL')
              for e in errors: print('-',e)
              sys.exit(23)
          print('PASS: static/editorial/link/schema/onboarding gate')
          PY_QA
          git diff --check
          if grep -R -E -n 'ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}' \
            rehberler/insan-onayi-escalation-karar-tablosu.html \
            rehberler/finans-ai-otomasyonu-guvenli-baslangic.html \
            araclar/finans-surec-kontrol-listesi.html \
            kanit/ornek-insan-onay-karti.html \
            public-proof/human-approval; then
            echo 'FAIL: secret-like token found'; exit 24
          fi
          echo 'PASS: secret scan and git diff check'

