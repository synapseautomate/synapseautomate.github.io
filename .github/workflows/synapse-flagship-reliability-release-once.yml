          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html kaynaklar.html sitemap.xml llms.txt llms-demand.txt \
            rehberler/insan-onayi-escalation-karar-tablosu.html \
            rehberler/finans-ai-otomasyonu-guvenli-baslangic.html \
            araclar/finans-surec-kontrol-listesi.html \
            kanit/ornek-insan-onay-karti.html \
            public-proof/human-approval \
            standards/enterprise-ai-workflow-reliability-standard-2026.html \
            assets/reports/Synapse_Enterprise_AI_Workflow_Reliability_Standard_2026.pdf \
            public-proof/enterprise-reliability-standard-2026
          git rm -f --ignore-unmatch .github/workflows/human-approval-proof-release-once.yml
          git rm -f --ignore-unmatch .github/workflows/synapse-flagship-reliability-release-once.yml
          if git diff --cached --quiet; then echo 'No staged changes.'; exit 0; fi
