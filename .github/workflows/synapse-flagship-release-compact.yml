name: Synapse Flagship Release Compact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Verify and unpack signed payload
        shell: bash
        run: |
          set -euo pipefail
          P=.github/workflows/synapse-flagship-release-payload.zip
          echo "2496a2d843a584c5e927a7e20fb85223d4bb244e4c34068e65a4b3863234dcf3  $P" | sha256sum -c -
          rm -rf /tmp/synapse-release && mkdir -p /tmp/synapse-release
          python3 -m zipfile -e "$P" /tmp/synapse-release
          python3 /tmp/synapse-release/_release/preflight.py .
          python3 /tmp/synapse-release/_release/apply.py .
      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f public-proof/structured-extraction-v1/requirements-test.txt
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r public-proof/structured-extraction-v1/requirements-test.txt
      - name: Red Bull quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/synapse-release/_release/qa.py .
          git diff --check
      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/human-approval-proof-release-once.yml
          git rm -f --ignore-unmatch .github/workflows/synapse-flagship-reliability-release-once.yml
          git rm -f --ignore-unmatch .github/workflows/synapse-flagship-release-compact.yml
          git rm -f --ignore-unmatch .github/workflows/synapse-flagship-release-payload.zip
          git add -A
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'Publish Synapse enterprise reliability standard'
          git push
