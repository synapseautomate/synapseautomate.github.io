name: Structured Workflow Proof Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Guard exact post-Day-10 baseline
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            file="$1"; expected="$2"
            test -f "$file" || { echo "Guard failed: missing $file. Nothing applied."; exit 21; }
            actual="$(sha256sum "$file" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Guard failed: $file changed after the verified baseline. Nothing applied."
              echo "expected=$expected"
              echo "actual=$actual"
              exit 21
            fi
          }
          check_sha "kaynaklar.html" "16930afc5959b43a023eb47fb13efa89ebe41a4646d98b665185dd826bb5310f"
          check_sha "llms-demand.txt" "0bbebfd1e0f7aafea435217be0d036ce4d0557d2c889d71b30ee4f211c6c1780"
          check_sha "llms.txt" "6cf9a5fb92cb8c84180969f73eac0507d0ac3991dd24a0910ffc6654bad355ca"
          check_sha "sektorler/dis-estetik-wellness.html" "b3cb555556d6220f4d60e61b26dd3ed760a6c64eabcd46261a81012d9263e080"
          check_sha "sitemap.xml" "2efe1350ac0fbee5b8f220ef8f39720cbe265cd8bf29718a199734fe23177708"
          for f in             RULES.md CONTRIBUTING.md D11             public-proof/structured-extraction-v1             rehberler/yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html             rehberler/saglik-randevu-otomasyonu-guvenli-baslangic.html             araclar/saglik-randevu-surec-kontrol-listesi.html; do
            if [ -e "$f" ]; then
              echo "Guard failed: new release path already exists: $f. Nothing applied."
              exit 21
            fi
          done
          echo "PASS: baseline guard"

