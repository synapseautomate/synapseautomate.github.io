      - name: Install local proof test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet -r public-proof/structured-extraction-v1/requirements-test.txt

      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 public-proof/structured-extraction-v1/validate.py
          python3 public-proof/structured-extraction-v1/test_ingest.py
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import csv
          root=Path('.')
          rows=list(csv.DictReader((root/'D11/ai_answer_library_v1.csv').open(encoding='utf-8-sig')))
          assert len(rows)==150, f'answer library rows={len(rows)}'
          assert all(40 <= int(r['word_count']) <= 80 for r in rows), 'answer length outside 40-80 words'
          pages={
            'rehberler/yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html':8,
            'araclar/saglik-randevu-surec-kontrol-listesi.html':5,
            'rehberler/saglik-randevu-otomasyonu-guvenli-baslangic.html':10,
          }
          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]; self.text=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.skip+=1
                  if tag=='a': self.hrefs.append(dict(attrs).get('href',''))
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip: self.text.append(data)
          for rel,n in pages.items():
              s=(root/rel).read_text(encoding='utf-8')
              assert '�' not in s
              assert s.count('<details>')==n, (rel,'visible FAQ count')
              assert s.count('"@type":"Question"')==n, (rel,'FAQ schema count')
              p=Parser(); p.feed(s); txt=' '.join(p.text)
              for bad in ('Day 11','Gün 11','DAY11','ChatGPT'):
                  assert bad not in txt,(rel,bad)
              for href in p.hrefs:
                  if not href or href.startswith(('#','http://','https://','mailto:','tel:','javascript:')): continue
                  path=href.split('?',1)[0].split('#',1)[0]
                  if not path: continue
                  target=((root/rel).parent/path).resolve()
                  assert target.exists(),(rel,href,str(target))
          sector=(root/'sektorler/dis-estetik-wellness.html').read_text(encoding='utf-8')
          assert 'saglik-randevu-surec-kontrol-listesi.html' in sector
          assert 'saglik-randevu-otomasyonu-guvenli-baslangic.html' in sector
          sources=(root/'kaynaklar.html').read_text(encoding='utf-8')
          assert 'yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html' in sources
          sm=(root/'sitemap.xml').read_text(encoding='utf-8')
          for slug in ('yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html','saglik-randevu-surec-kontrol-listesi.html','saglik-randevu-otomasyonu-guvenli-baslangic.html'):
              assert slug in sm
          print('PASS: 150-answer library + public HTML + FAQ/schema + links + discovery')
          PY
          git diff --check
          if grep -RIE -n 'ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'             RULES.md CONTRIBUTING.md D11 public-proof/structured-extraction-v1             rehberler/yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html             rehberler/saglik-randevu-otomasyonu-guvenli-baslangic.html             araclar/saglik-randevu-surec-kontrol-listesi.html; then
            echo "FAIL: secret-like token found"
            exit 1
          fi
          echo "PASS: secret scan"

      - name: Commit release and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             RULES.md CONTRIBUTING.md D11             public-proof/structured-extraction-v1             rehberler/yapilandirilmis-cikarim-kaynak-dogrulama-insan-onayi.html             rehberler/saglik-randevu-otomasyonu-guvenli-baslangic.html             araclar/saglik-randevu-surec-kontrol-listesi.html             sektorler/dis-estetik-wellness.html kaynaklar.html llms.txt llms-demand.txt sitemap.xml
          git rm -f --ignore-unmatch .github/workflows/day11-structured-workflow-release.yml
          if git diff --cached --quiet; then
            echo "No staged change; nothing to commit."
            exit 0
          fi
          git commit -m "Publish structured extraction proof and safe appointment checklist"
          git push origin "HEAD:${{ github.ref_name }}"
