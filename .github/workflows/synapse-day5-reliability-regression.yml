name: Synapse Day 5 Reliability Regression

on:
  push:
    branches: [main]
    paths:
      - 'public-proof/reliability-regression-v1/**'
      - '.github/workflows/synapse-day5-reliability-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 100-case baseline regression
        working-directory: public-proof/reliability-regression-v1
        run: python run_regression.py test_cases.csv

      - name: Run deliberate mutation checks
        working-directory: public-proof/reliability-regression-v1
        run: python run_mutation_checks.py mutation_checks.csv
