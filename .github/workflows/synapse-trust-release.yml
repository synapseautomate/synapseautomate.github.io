          base64 -d /tmp/synapse-trust-release.b64 > /tmp/synapse-trust-release.tar.gz
          tar -xzf /tmp/synapse-trust-release.tar.gz -C .

      - name: Run release quality gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/trust_quality_gate.py
          git diff --check

      - name: Commit and push only if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            guven-merkezi.html \
            gizlilik.html \
            surec-analizi.html \
            iletisim.html \
            kaynaklar.html \
            sektorler/gayrimenkul-yonetimi.html \
            kanit/risk-yetki-matrisi.html \
            kanit/ornek-insan-onay-karti.html \
            llms.txt \
            sitemap.xml \
            veri/public-entity.json \
            scripts/trust_quality_gate.py \
            public-proof/workflow-output-schema-v2 \
            public-proof/eval-50-v1
          git commit -m "Publish trust center and authority controls"
          git push origin HEAD:${GITHUB_REF_NAME}
