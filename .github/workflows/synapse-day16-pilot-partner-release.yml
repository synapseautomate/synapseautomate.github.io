name: Synapse Day16 Pilot Partner Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/synapse-day16-pilot-partner-payload.zip
          rm -rf /tmp/synapse-day16
          mkdir -p /tmp/synapse-day16
          unzip -q .github/workflows/synapse-day16-pilot-partner-payload.zip -d /tmp/synapse-day16
          python3 /tmp/synapse-day16/preflight.py "$GITHUB_WORKSPACE"
      - name: Apply additive release
        run: python3 /tmp/synapse-day16/apply.py "$GITHUB_WORKSPACE"
      - name: Quality gate
        run: python3 /tmp/synapse-day16/qa.py "$GITHUB_WORKSPACE"
      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "synapseautomate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "Release controlled pilot and partner-ready proof"
            git push
          fi
      - name: Clean one-shot release files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/synapse-day16-pilot-partner-release.yml
          rm -f .github/workflows/synapse-day16-pilot-partner-payload.zip
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Day16 one-shot release files"
          git push
