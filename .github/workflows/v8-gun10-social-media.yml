name: V8 Day10 Instagram Story YouTube Media
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v8_gun10_social_render.mjs'
      - 'scripts/v8_gun10_youtube_tool_capture.mjs'
      - 'operasyon/v8/gun-10/social/**'
      - '.github/workflows/v8-gun10-social-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render exact-sized Instagram PNG and real-scored browser video
        shell: bash
        run: |
          set -euo pipefail
          export SYNAPSE_MEDIA_DIR=/tmp/synapse-social-v8-g10
          node scripts/v8_gun10_social_render.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/synapse-social-http.log 2>&1 &
          sleep 2
          node scripts/v8_gun10_youtube_tool_capture.mjs
          ffmpeg -hide_banner -loglevel error -y \
            -i "$SYNAPSE_MEDIA_DIR/SYNAPSE_YOUTUBE_GERCEK_TARAYICI_KAYDI.webm" \
            -c:v libx264 -crf 21 -pix_fmt yuv420p -movflags +faststart \
            "$SYNAPSE_MEDIA_DIR/SYNAPSE_YOUTUBE_GERCEK_ARAC_TESTI_1920x1080.mp4"
          test -s "$SYNAPSE_MEDIA_DIR/SYNAPSE_YOUTUBE_GERCEK_ARAC_TESTI_1920x1080.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 "$SYNAPSE_MEDIA_DIR/SYNAPSE_YOUTUBE_GERCEK_ARAC_TESTI_1920x1080.mp4"
      - name: Upload media evidence (never post automatically)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-gun10-ig-story-youtube-real-qa
          path: /tmp/synapse-social-v8-g10/
          retention-days: 30
          if-no-files-found: error
