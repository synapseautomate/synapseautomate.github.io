name: Deploy Current Main to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'D01/' \
            --exclude 'D02/' \
            --exclude 'D03/' \
            --exclude '__pycache__/' \
            --exclude '*.zip' \
            --exclude '*.sha256' \
            --exclude '*.py' \
            --exclude 'README*.md' \
            --exclude 'DEPLOYMENT.md'

          test -f _site/index.html
          test -f _site/sektorler/finans-bankacilik.html
          test -f _site/araclar/finans-surec-kontrol-listesi.html
          test -f _site/araclar/site-ai-uyumluluk-taramasi.html
          test -f _site/demolar/vela-saha-akisi.html
          test -f _site/kanit/ai-otomasyon-kanit-metodolojisi.html
          test -f _site/assets/day3/day3.css
          test -f _site/sitemap.xml
          test -f _site/robots.txt

          # Public artifact must not contain transport/internal files.
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .

          echo "PAGES PUBLIC ARTIFACT QA: PASS"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
