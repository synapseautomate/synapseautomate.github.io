name: Deploy Current Main to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'D01/' \
            --exclude 'D02/' \
            --exclude 'D03/' \
            --exclude '__pycache__/' \
            --exclude '*.zip' \
            --exclude '*.sha256' \
            --exclude '*.py' \
            --exclude 'README*.md' \
            --exclude 'DEPLOYMENT.md'

          test -f _site/index.html
          test -f _site/sektorler/finans-bankacilik.html
          test -f _site/araclar/finans-surec-kontrol-listesi.html
          test -f _site/araclar/site-ai-uyumluluk-taramasi.html
          test -f _site/demolar/vela-saha-akisi.html
          test -f _site/kaynaklar.html
          test -f _site/guven-merkezi.html
          test -f _site/site-haritasi.html
          test -f _site/kanit/teknik-kanit-indeksi.html
          test -f _site/kanit/workflow-guven-benchmark-v1.html
          test -f _site/teklif/gayrimenkul-yonetimi-surec-analizi.html
          test -f _site/surec-analizi.html
          test -f _site/talep-alindi.html
          test -f _site/public-proof/workflow-benchmark-v1/benchmark_summary.csv
          test -f _site/public-proof/workflow-benchmark-v1/release_note.md
          test -f _site/public-proof/workflow-benchmark-v1/manifest.json
          test -f _site/public-proof/reliability-regression-v2/heldout_20_results.json
          test -f _site/public-proof/workflow-opportunity-benchmark/proof-manifest.json
          test -f _site/degisiklikler.html
          test -f _site/sablonlar/index.html
          test -f _site/kanit/ai-otomasyon-kanit-metodolojisi.html
          test -f _site/assets/day3/day3.css
          test -f _site/sitemap.xml
          test -f _site/robots.txt

          # Public artifact must not contain transport/internal files.
          ! find _site -type f \( -name '*.zip' -o -name '*.py' -o -name '*.sha256' \) | grep -q .

          grep -q 'name="robots" content="noindex,follow"' _site/urunler/revenueos.html
          grep -q 'name="robots" content="noindex,follow"' _site/sektorler/finans.html
          grep -q 'https://synapseautomate.github.io/sektorler/finans-bankacilik.html' _site/sektorler/finans.html
          grep -q 'https://synapseautomate.github.io/kanit/teknik-kanit-indeksi.html' _site/sitemap.xml
          grep -q 'https://synapseautomate.github.io/teklif/gayrimenkul-yonetimi-surec-analizi.html' _site/sitemap.xml
          grep -q 'data-synapse-lead="process_analysis"' _site/surec-analizi.html
          grep -q 'submitted=process_analysis' _site/surec-analizi.html
          grep -q 'data-synapse-success="process_analysis"' _site/talep-alindi.html
          grep -q "emit('generate_lead'" _site/assets/js/synapse-measurement-v1.js
          grep -q 'name="robots" content="noindex,follow"' _site/talep-alindi.html
          ! grep -q 'https://synapseautomate.github.io/sektorler/finans.html' _site/sitemap.xml
          ! grep -q 'https://synapseautomate.github.io/urunler/revenueos.html' _site/sitemap.xml
          echo "PAGES PUBLIC ARTIFACT QA: PASS"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
