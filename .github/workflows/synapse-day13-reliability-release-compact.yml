name: Synapse Day13 Reliability Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Verify, preflight and apply payload
        shell: bash
        run: |
          set -euo pipefail
          P=.github/workflows/synapse-day13-reliability-payload.zip
          echo "2bc69e5b4a239e03235805c86eff60b71284a2677939c30ca827bec2d9b7beb0  $P" | sha256sum -c -
          rm -rf /tmp/synapse-day13 && mkdir -p /tmp/synapse-day13
          python3 -m zipfile -e "$P" /tmp/synapse-day13
          python3 /tmp/synapse-day13/_release/preflight.py .
          python3 /tmp/synapse-day13/_release/apply.py .
      - name: Install existing QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r public-proof/structured-extraction-v1/requirements-test.txt
      - name: Red Bull quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/synapse-day13/_release/qa.py .
          git diff --check
      - name: Commit verified Day 13 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/synapse-day13-reliability-release-compact.yml
          git rm -f --ignore-unmatch .github/workflows/synapse-day13-reliability-payload.zip
          git add -A
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'Publish Day 13 frozen reliability regression'
          git push
