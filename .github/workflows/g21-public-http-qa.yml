name: G21 Public HTTP Verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g21-public-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-links:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify published G21 guide, entry links and metadata
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys
          base="https://synapseautomate.github.io"
          checks={
            "/cozumler/musteri-asistani-sss-insan-devri.html": ["Her sorunun yanıtı otomatik değildir.", "SENTETİK ÖRNEK", "surec-analizi.html", 'rel="canonical"'],
            "/hizmetler.html": ["musteri-asistani-sss-insan-devri.html"],
            "/index.html": ["musteri-asistani-sss-insan-devri.html"],
            "/sitemap.xml": ["musteri-asistani-sss-insan-devri.html"]
          }
          for attempt in range(12):
            failures=[]
            for path,required in checks.items():
              try:
                req=urllib.request.Request(base+path,headers={"User-Agent":"SYNAPSE-G21-QA/1.0"})
                with urllib.request.urlopen(req, timeout=18) as response:
                  status=response.status
                  body=response.read(350000).decode("utf-8","replace")
                  missing=[x for x in required if x not in body]
                  if status!=200 or missing: failures.append((path,status,missing))
                  else: print("PASS",path,status)
              except Exception as exc:failures.append((path,type(exc).__name__,str(exc)[:120]))
            if not failures:
              print("G21 PUBLIC HTTP PASS 4/4")
              sys.exit(0)
            print("Attempt",attempt+1,"failures",failures,flush=True)
            time.sleep(12)
          print("FAIL: live deployment not verified")
          sys.exit(1)
          PY
