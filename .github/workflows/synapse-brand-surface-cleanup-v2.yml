name: Synapse Brand Surface Cleanup v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signed cleanup payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=.github/workflows/synapse-brand-surface-cleanup-payload-v2.zip
          test -f "$PAYLOAD"
          echo "d022b409034b3536c8993ad05136a560175339d6116d3d4d5952ce41cbf3d3aa  $PAYLOAD" | sha256sum -c -
          rm -rf /tmp/synapse-brand-cleanup
          mkdir -p /tmp/synapse-brand-cleanup
          unzip -q "$PAYLOAD" -d /tmp/synapse-brand-cleanup

      - name: Protected baseline guard
        run: python3 /tmp/synapse-brand-cleanup/preflight.py "$GITHUB_WORKSPACE"

      - name: Apply public-surface cleanup
        run: python3 /tmp/synapse-brand-cleanup/apply.py "$GITHUB_WORKSPACE"

      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r public-proof/structured-extraction-v1/requirements-test.txt

      - name: Brand quality gate
        run: python3 /tmp/synapse-brand-cleanup/qa.py "$GITHUB_WORKSPACE"

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/synapse-brand-surface-cleanup.yml
          rm -f .github/workflows/synapse-brand-surface-cleanup-payload.zip
          rm -f .github/workflows/synapse-brand-surface-cleanup-v2.yml
          rm -f .github/workflows/synapse-brand-surface-cleanup-payload-v2.zip
          git config user.name "synapseautomate"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clean public brand surface without overwriting live page edits"
          git push
