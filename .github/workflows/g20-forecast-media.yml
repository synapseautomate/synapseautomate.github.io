name: Day20 Original Forecast Video Render
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v8_g20_forecast_social_video.py'
      - '.github/workflows/g20-forecast-media.yml'
permissions:
  contents: write
jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/g20-new-forecast-videos-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render original independent concept videos
        run: python scripts/v8_g20_forecast_social_video.py
      - name: Full decode, verify dimensions, codec, cover frames, SHA
        run: |
          mkdir -p /tmp/g20-media-qa
          for mode in YATAY DIKEY; do
            f="assets/media/g20/SYNAPSE_G20_TALEP_TAHMINI_$mode.mp4"
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,pix_fmt -of json "$f" > "/tmp/g20-media-qa/$mode.json"
            ffmpeg -v error -i "$f" -f null -
            ffmpeg -v error -ss 12 -i "$f" -frames:v 1 -y "/tmp/g20-media-qa/$mode.png"
            sha256sum "$f" >> /tmp/g20-media-qa/SHA256.txt
          done
      - name: Commit videos to release branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/g20
          git diff --cached --quiet && exit 0
          git commit -m "media(g20): add decoded original forecast MP4 and subtitles"
          git push origin HEAD:release/g20-new-forecast-videos-20261030
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g20-video-qa
          path: /tmp/g20-media-qa/
          if-no-files-found: warn
