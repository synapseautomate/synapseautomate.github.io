name: Synapse Day 4 Revenue Bridge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revenue-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Day 4 revenue bridge
        run: python3 scripts/synapse_day4_revenue_bridge.py

      - name: Commit Day 4 revenue bridge
        run: |
          git config user.name "synapse-day4-revenue"
          git config user.email "synapse-day4-revenue@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Day 4 revenue bridge changes needed."
          else
            git commit -m "feat: connect Day 4 proof to inbound revenue funnel"
            git push
          fi
