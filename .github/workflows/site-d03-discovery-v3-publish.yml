name: Publish Synapse Free AI Tools Discovery V3

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: synapse-site-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate V3 discovery package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'SYNAPSE_D03_DISCOVERY_V3*.zip' | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one V3 discovery package, found ${#zips[@]}"
            printf '%s\n' "${zips[@]:-}"
            exit 1
          fi
          echo "DISCOVERY_ZIP=${zips[0]}" >> "$GITHUB_ENV"

      - name: Apply and QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .d03_discovery
          mkdir .d03_discovery
          unzip -q "$DISCOVERY_ZIP" -d .d03_discovery
          python3 .d03_discovery/apply.py .
          python3 .d03_discovery/qa.py .
          git diff --check

      - name: Remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .d03_discovery
          rm -f "$DISCOVERY_ZIP"

      - name: Commit discovery improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "synapse-mobile"
          git config user.email "synapse-mobile@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content change."
          else
            git commit -m "D03: expose free AI tools and improve customer discovery"
            git push origin HEAD:main
          fi

      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/             --exclude '.git/'             --exclude '.github/'             --exclude '_site/'             --exclude 'D01/'             --exclude 'D02/'             --exclude 'D03/'             --exclude '__pycache__/'             --exclude '*.zip'             --exclude '*.sha256'             --exclude '*.py'             --exclude 'README*.md'             --exclude 'DEPLOYMENT.md'
          test -f _site/index.html
          test -f _site/kaynaklar.html
          grep -q "Ücretsiz AI Araçları" _site/index.html
          grep -q "Ücretsiz AI Araçları" _site/kaynaklar.html
          grep -q "D03_FREE_AI_TOOLS_NAV_GUARD" _site/assets/app-v33.js
          echo "PUBLIC DISCOVERY ARTIFACT QA: PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
