name: Synapse IndexNow After Successful Publish

on:
  workflow_run:
    workflows:
      - Deploy Current Main to GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: synapse-indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Notify only changed indexable URLs
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/day28_indexnow_notify.py
