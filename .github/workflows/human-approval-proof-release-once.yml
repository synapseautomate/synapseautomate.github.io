name: Human Approval Proof Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Preflight guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GUARD'
          from pathlib import Path
          import hashlib, json, sys
          expected = json.loads(r'''{"D11/day11_decision_log.md": "2882e3dcee8b4a6159d4fabe3d8ecb0321e59fc88d02b6b54f765134bfbe3b4d", "araclar/finans-surec-kontrol-listesi.html": "aa67772bab0577c47b95aeb80fcf04fa156e3e54f2712d19ad764a01280cce45", "kanit/ornek-insan-onay-karti.html": "f50c46314fb5f954b41209782a76610d0fd352270f2f2ec04d1e8f365d29b4b1", "kaynaklar.html": "4000b5eb3fc1131314d8b1284b48ca013712876f175cf2ab331234d1da4bb468", "llms-demand.txt": "aaf51bb9e64a2ce19a74a41e0cadcf454b6a47ac95f80db9a7b375b8a2ac0cac", "llms.txt": "841890a81da3bf7f942a18360ab51c8fc824582d7ba2c85569531fd160967ec9", "public-proof/structured-extraction-v1/README.md": "78523cb16965cc6c90a29ef65f4926803589949d43b7d4eab63137d4f47cdc65", "rehberler/finans-ai-otomasyonu-guvenli-baslangic.html": "a483fbf6fc1610946680d46dd2d34ecd6bea5923a580c151c90d878de64af22f", "sitemap.xml": "1ffcc9ffd3a0e989c9c0299333f462e79475228b87f3ad401d7e614d625b0ade", "surec-analizi.html": "9ec99797fcf42288e076f6f6130cc5993a0859e9a5c47a65d3e9222c87e48a96"}''')
          new_paths = json.loads(r'''["rehberler/insan-onayi-escalation-karar-tablosu.html", "public-proof/human-approval/README.md", "public-proof/human-approval/validate_rules.py", "public-proof/human-approval/approval-card-example.json", "public-proof/human-approval/action-log-sample.csv", "public-proof/human-approval/incident-tabletop.md", "public-proof/human-approval/automation-candidate-spec.md", "public-proof/human-approval/finance-demo-cases.csv", "public-proof/human-approval/time-cost-table.csv"]''')
          errors = []
          for rel, want in expected.items():
              p = Path(rel)
              if not p.is_file():
                  errors.append(f"missing guarded file: {rel}")
                  continue
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  errors.append(f"snapshot mismatch: {rel} ({got[:12]} != {want[:12]})")
          for rel in new_paths:
              if Path(rel).exists():
                  errors.append(f"new-path collision: {rel}")
          if errors:
              print('GUARD FAILED - nothing applied')
              for e in errors: print('-', e)
              sys.exit(21)
          print('PASS: exact verified baseline')
          PY_GUARD

