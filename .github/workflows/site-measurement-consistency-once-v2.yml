name: Site Measurement and Consistency v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preflight guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          tool = Path('araclar/surecini-20-dakikada-haritala.html')
          analysis = Path('surec-analizi.html')
          roofing = Path('cozumler/roofing-ev-hizmetleri.html')
          asset = Path('assets/attribution-v1.js')

          for p in (tool, analysis, roofing):
              if not p.exists():
                  raise SystemExit(f'Missing required file: {p}')

          tool_source = 'acf380b178c1ee4fc3f09eb790b6466e010523657deecc94aa201b1e2d2c53d6'
          tool_target = '4d7b0b65c119b5a746db6cd77908e967714bb854bb9d15f17d8e00ca0c4afcc9'
          roof_source = '56ad3a842fc69d9208980c690d1c23be5b62fc3c61a1b992385304c7d02a162a'
          roof_target = 'd1e11776207ef7b4fc7eac4d7a2a6e71c94cba0b27461e93e9617b2d6e132820'
          asset_target = '4b8be71b094b1493e7fe55f8373002bcb06ca6c3f1158e52902bb3a1b65b99cf'

          if sha(tool) not in {tool_source, tool_target}:
              raise SystemExit('Guard failed: free-tool page changed unexpectedly. Nothing applied.')
          if sha(roofing) not in {roof_source, roof_target}:
              raise SystemExit('Guard failed: roofing page changed unexpectedly. Nothing applied.')
          if asset.exists() and sha(asset) != asset_target:
              raise SystemExit('Guard failed: existing attribution asset differs. Nothing applied.')

          s = analysis.read_text(encoding='utf-8')
          expected_script = '<script src="assets/attribution-v1.js" defer></script>'
          if expected_script not in s:
              required = ['formsubmit.co', 'Süreç Analizi', '</body>']
              missing = [x for x in required if x not in s]
              if missing or s.count('</body>') != 1:
                  raise SystemExit('Guard failed: current surec-analizi.html structure is not safe for a surgical patch. Nothing applied.')
          elif s.count(expected_script) != 1:
              raise SystemExit('Guard failed: duplicate attribution include in surec-analizi.html. Nothing applied.')

          print('Preflight PASS: surec-analizi.html differs from the Day 9 snapshot, but safe anchors are intact.')
          PY

      - name: Apply surgical Day 10 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          ATTR = base64.b64decode("")
          ROOF = base64.b64decode("")

          def sha_bytes(b):
              return hashlib.sha256(b).hexdigest()

          tool = Path('araclar/surecini-20-dakikada-haritala.html')
          analysis = Path('surec-analizi.html')
          roofing = Path('cozumler/roofing-ev-hizmetleri.html')
          asset = Path('assets/attribution-v1.js')

          tool_source = 'acf380b178c1ee4fc3f09eb790b6466e010523657deecc94aa201b1e2d2c53d6'
          tool_target = '4d7b0b65c119b5a746db6cd77908e967714bb854bb9d15f17d8e00ca0c4afcc9'
          roof_source = '56ad3a842fc69d9208980c690d1c23be5b62fc3c61a1b992385304c7d02a162a'
          roof_target = 'd1e11776207ef7b4fc7eac4d7a2a6e71c94cba0b27461e93e9617b2d6e132820'

          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(ATTR)

          tool_bytes = tool.read_bytes()
          th = sha_bytes(tool_bytes)
          if th == tool_source:
              s = tool_bytes.decode('utf-8')
              marker = '<script src="../assets/attribution-v1.js" defer></script>'
              if s.count('</body>') != 1:
                  raise SystemExit('Unexpected free-tool body structure during apply.')
              s = s.replace('</body>', marker + '</body>', 1)
              tool.write_text(s, encoding='utf-8')
          elif th != tool_target:
              raise SystemExit('Free-tool hash changed between guard and apply.')

          s = analysis.read_text(encoding='utf-8')
          marker = '<script src="assets/attribution-v1.js" defer></script>'
          if marker not in s:
              if s.count('</body>') != 1:
                  raise SystemExit('Unexpected analysis-page body structure during apply.')
              s = s.replace('</body>', marker + '</body>', 1)
              analysis.write_text(s, encoding='utf-8')

          rh = sha_bytes(roofing.read_bytes())
          if rh == roof_source:
              roofing.write_bytes(ROOF)
          elif rh != roof_target:
              raise SystemExit('Roofing hash changed between guard and apply.')

          print('Apply PASS')
          PY

      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          expected = {
              'assets/attribution-v1.js': '4b8be71b094b1493e7fe55f8373002bcb06ca6c3f1158e52902bb3a1b65b99cf',
              'araclar/surecini-20-dakikada-haritala.html': '4d7b0b65c119b5a746db6cd77908e967714bb854bb9d15f17d8e00ca0c4afcc9',
              'cozumler/roofing-ev-hizmetleri.html': 'd1e11776207ef7b4fc7eac4d7a2a6e71c94cba0b27461e93e9617b2d6e132820',
          }
          for p, h in expected.items():
              if sha(p) != h:
                  raise SystemExit(f'QA FAIL: hash mismatch for {p}')

          analysis = Path('surec-analizi.html').read_text(encoding='utf-8')
          if analysis.count('<script src="assets/attribution-v1.js" defer></script>') != 1:
              raise SystemExit('QA FAIL: analysis attribution include')
          if 'formsubmit.co' not in analysis:
              raise SystemExit('QA FAIL: analysis form missing')

          roof = Path('cozumler/roofing-ev-hizmetleri.html').read_text(encoding='utf-8')
          if roof.count('"@type": "Question"') != 12:
              raise SystemExit('QA FAIL: roofing FAQ schema is not 12')
          if roof.count('<details') != 12:
              raise SystemExit('QA FAIL: roofing visible FAQ count is not 12')
          for required in ['4.900 TL', 'Süreç Analizi', 'insan', 'güven']:
              if required not in roof:
                  raise SystemExit(f'QA FAIL: roofing missing required term: {required}')

          for p in ['surec-analizi.html','araclar/surecini-20-dakikada-haritala.html','cozumler/roofing-ev-hizmetleri.html','assets/attribution-v1.js']:
              t = Path(p).read_text(encoding='utf-8')
              if '\ufffd' in t or 'Ã' in t or 'Â' in t:
                  raise SystemExit(f'QA FAIL: encoding artifact in {p}')

          asset = Path('assets/attribution-v1.js').read_text(encoding='utf-8')
          if re.search(r'(?i)(api[_-]?key|secret|password)\s*[:=]\s*["\'][^"\']+["\']', asset):
              raise SystemExit('QA FAIL: possible secret in attribution asset')

          print('QA PASS: attribution, UTF-8, FAQ/schema, CTA/trust checks')
          PY

      - name: Commit Day 10 site close
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/attribution-v1.js araclar/surecini-20-dakikada-haritala.html surec-analizi.html cozumler/roofing-ev-hizmetleri.html
          if git diff --cached --quiet; then
            echo "No content changes needed; Day 10 patch is already present."
            exit 0
          fi
          git commit -m "Day 10: close measurement attribution and roofing consistency"
          git push origin "HEAD:${{ github.ref_name }}"
