name: Synapse GitHub Public Proof

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build public proof package
        run: python3 scripts/synapse_github_public_proof.py

      - name: Commit public proof package
        run: |
          git config user.name "synapse-public-proof"
          git config user.email "synapse-public-proof@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public-proof changes needed."
          else
            git commit -m "docs: publish workflow opportunity benchmark proof"
            git push
          fi
