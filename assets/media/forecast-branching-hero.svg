<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Üç olasılığa ayrılan tedarik rotası</title>
<desc id="desc">Koyu lacivert bir depo silüeti içinde, tek bir akışın yüksek, temel ve düşük senaryoları temsil eden üç ayrı rotaya ayrılması.</desc>
