<text x="167" y="1028" fill="#F3FAFC" font-size="30" font-family="Arial, sans-serif">Rezerve stok hesaba katıldı mı?</text>
<text x="68" y="1135" fill="#F3FAFC" font-size="32" font-family="Arial, sans-serif" font-weight="700">Fark bir bulgudur. Kayıp kararı değildir.</text>
