<text x="167" y="918" fill="#F3FAFC" font-size="30" font-family="Arial, sans-serif">Stok hangi anda ölçüldü?</text>
<text x="100" y="973" fill="#69EDD3" font-size="31" font-family="Arial, sans-serif" font-weight="700">02</text>
<text x="167" y="973" fill="#F3FAFC" font-size="30" font-family="Arial, sans-serif">Depolar gerçekten aynı mı?</text>
